# Failures the end-to-end suite has found in Beatlayer that aren't fixed yet.
#
# A sweep goes on past a listed failure, and fails on any failure that isn't
# listed and on any listed entry whose check now passes: a fix deletes its
# entry in the same change. Every entry is a real, reproducible bug in
# Beatlayer, never a gap in the harness (a harness bug is fixed in the
# harness). `bl_e2e::known` reads this file.
#
# Each entry is a [[failure]] table with four fields, all required:
#
#   suite        the test family that finds it: commands, devices,
#                live_offline, background, round_trips, scenarios or smoke
#   key          what was checked: a command ID, a device type and parameter
#                name, or a scenario's step
#   property     the property that doesn't hold, as the suite names it
#   description  the bug in plain words: what was done, what was expected,
#                what happened
#
# For example:
#
#   [[failure]]
#   suite = "devices"
#   key = "beatlayer.grit/Drive"
#   property = "level bounded"
#   description = "At its maximum the output rises 30 dB above the default setting."

[[failure]]
suite = "live_offline"
key = "rich set without the arpeggiator"
property = "live matches offline"
description = "The master Limiter's look-ahead (3 ms, 144 frames at 48,000 Hz) is not placed the same live as in an export: the rich set, played live from bar 1 and exported, differs from frame 0 at a residual of 0.3 dB at lag 0 and matches at a lag of 144 frames (correlation 1.0000). With the Limiter disabled the set matches to the bit, Reprise's tempo-ramp time included."

[[failure]]
suite = "background"
key = "export flac 24-bit stereo"
property = "round trip keeps it"
description = "A FLAC file of the rich set's first two bars decodes 4,096 frames short: the loud block at frames 8,192 to 12,288 (peak 0.97) comes back from the decoder as nothing, and the stream after it shifts earlier. The same block written alone to a FLAC file with `AudioWriter` decodes to 0 frames, so the fault is in the FLAC encoder or the decoder reading it, not in the render, which WAV and AIFF write whole. It showed up once exports stopped starting a few frames late, which moved the audio in that block."

[[failure]]
suite = "live_offline"
key = "rich set without the arpeggiator, from bar 2"
property = "live matches offline"
description = "The same Limiter look-ahead fault as the rich set played from bar 1, seen when playing starts at bar 2 and runs one bar: the live capture differs from the export from frame 0 at a residual of 0.4 dB at lag 0, with the same level, and matches at a lag of 144 frames (correlation 1.0000). It is only checked at full depth."

[[failure]]
suite = "background"
key = "export flac 24-bit mono"
property = "round trip keeps it"
description = "The same FLAC fault as the 24-bit stereo file, for a mono export: the file decodes 8,192 frames short (180,677 frames, not 188,869). It is only checked at full depth."
