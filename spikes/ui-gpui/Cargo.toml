[package]
name = "bl-spike-ui-gpui"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
publish = false
description = "WP-0.8a: the UI benchmark scene in GPUI. A throwaway spike."

# A standalone workspace: the root workspace excludes spikes/.
[workspace]

# GPUI from crates.io: the weekly `gpui-pre` snapshot of Zed's `gpui` crate,
# pinned exactly because every snapshot may break the API. gpui-component
# 0.7.1 pins the same snapshot (=0.3.8).
[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.8" }
# `runtime_shaders` compiles the Metal shaders when the app starts, because
# Xcode 27 ships the Metal compiler as a separate download that this Mac
# doesn't have. See docs/spikes/ui-gpui.md.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit", "wayland", "x11", "runtime_shaders"] }
gpui-component = { version = "=0.7.1", default-features = false }
raw-window-handle = "0.6.2"
libc = "0.2.180"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", features = ["block2"] }
objc2-foundation = "0.3.2"
block2 = "0.6.2"

[features]
# Turns on GPUI's test support for `Window::render_to_image`, used by
# `--screenshot`. Bench numbers come from builds without it.
screenshot = ["gpui/test-support", "gpui_platform/test-support"]

[profile.release]
debug = 1
