# Runs `cargo xtask check` on Windows (x64) and Linux (x64) for every pull
# request and every push to main, and when started by hand
# (`gh workflow run ci.yml --ref <branch>`), with macOS (arm64) too if the run
# asks for it. Alongside, it runs the real-time tests under RealtimeSanitizer
# on Linux (x64).
#
# macOS stays out of per-change CI: every author runs the check on macOS
# locally and pastes the evidence in the pull request, and macos-check.yml
# runs the full check on main every night that code changed.
#
# Tests run under cargo-nextest, each in a process of its own, as many at
# once as the runner has cores. How much they test depends on the event:
#
# - On a pull request, only the packages the pull request changes, and every
#   package that depends on them, run their tests (`cargo xtask check
#   --affected` against the base branch; xtask/src/affected.rs has the rules).
#   A change to anything every package shares (Cargo.toml or Cargo.lock, the
#   toolchain, Cargo's or the tools' configuration, xtask, .github/, the
#   shared fixtures in tests/ or assets/, or any file outside a package) still
#   tests everything. Every other step (format, clippy, layers, deny, and the
#   rest) stays workspace-wide. The property, stress, and kill tests run at
#   BL_TEST_DEPTH=quick: every property, with fewer cases.
# - On a push to main and a manual run, every package's tests run, at
#   BL_TEST_DEPTH=full, as they do in the nightly macOS check.
#
# That's the safety net: if a pull request's selection misses a package it
# should have tested, or a quick run misses a case a full one finds, the push
# that merges it runs everything at full depth, so the miss shows up within
# one run of merging.
#
# The workflow also:
#
# - builds nothing for changes that touch only prose: Markdown outside the
#   crates (a crate can compile its Markdown in, as bl-agent does its
#   guide), the licence, or the issue templates. On pushes to main the path
#   filter skips the run; on pull requests the `changes` job decides instead,
#   and the required checks (`check (Windows x64)`, `check (Linux x64)`, and
#   `RealtimeSanitizer (Linux x64)`, which branch protection on main
#   requires) still report, passing without running a step, so a prose-only
#   pull request can merge;
# - cancels a run when a newer commit supersedes it;
# - restores the dependency cache on every run, but saves it only from main,
#   so pull requests share main's cache instead of filling the 10 GB quota;
# - times out a hung job after 30 minutes rather than the default six hours.
#
# A failure on one platform doesn't cancel the others (fail-fast is off). Most
# authors can only test macOS locally, so one run should report every
# platform's failures rather than one at a time.
#
# Every third-party action is pinned to a full commit SHA, with its version in
# a comment. Update the SHA and the comment together.

name: CI

on:
  # No path filter: a pull request must always report the required checks.
  # The `changes` job skips the work for prose-only changes instead.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # The filter includes everything, then excludes prose, then takes back
    # the packages' Markdown. The last matching pattern wins. Keep it in step
    # with the patterns in the `changes` job.
    paths:
      - "**"
      - "!**.md"
      - "!LICENSE"
      - "!.github/ISSUE_TEMPLATE/**"
      - "crates/**"
      - "xtask/**"
  workflow_dispatch:
    inputs:
      macos:
        description: Also run on macOS (a macOS minute costs ten Linux minutes)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Line tables keep test backtraces readable while making the target
  # directory, and so the cache, much smaller than full debug info.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  RUST_BACKTRACE: 1

jobs:
  # Whether a pull request touches anything besides prose. Pushes and manual
  # runs always build (pushes to main are filtered by path above).
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: Look for changes besides prose
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          code=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            code=false
            files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
            while IFS= read -r file; do
              case "$file" in
                # A package's Markdown can be compiled in.
                crates/* | xtask/*) ;;
                *.md | LICENSE | .github/ISSUE_TEMPLATE/*) continue ;;
              esac
              code=true
              echo "Builds because of $file"
              break
            done <<< "$files"
          fi
          [ "$code" = true ] || echo "Only prose changed: the checks pass without building"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  check:
    name: check (${{ matrix.name }})
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Windows and Linux on every run; macOS too only when a manual run
        # asks. See the note at the top.
        include: ${{ fromJSON(inputs.macos && '[{"name":"macOS arm64","os":"macos-15"},{"name":"Windows x64","os":"windows-2025"},{"name":"Linux x64","os":"ubuntu-24.04"}]' || '[{"name":"Windows x64","os":"windows-2025"},{"name":"Linux x64","os":"ubuntu-24.04"}]') }}
    defaults:
      run:
        shell: bash
    steps:
      # rustfmt.toml asks for Unix line endings, and the Windows runner's Git
      # would otherwise check files out with CRLF, failing `cargo fmt --check`.
      - name: Keep LF line endings
        if: needs.changes.outputs.code == 'true'
        run: git config --global core.autocrlf false

      # A pull request's check compares it with the merge base of its base
      # branch, so it needs the history; other runs need only the commit.
      - name: Check out
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}

      # cpal's `asio` feature pulls in asio-sys, whose build script downloads
      # Steinberg's ASIO SDK when CPAL_ASIO_DIR is unset. ASIO goes through
      # azo instead (decision D9). rtsan-standalone-sys clones and builds
      # LLVM's compiler-rt, or fetches prebuilt runtimes, unless it's handed
      # one; the RealtimeSanitizer harness in rtsan/ links an installed
      # runtime itself instead (WP-0.4). Add any other crate whose build
      # script downloads an SDK or binaries to the pattern.
      - name: Refuse dependencies that download at build time
        if: needs.changes.outputs.code == 'true'
        run: |
          if grep -En '^name = "(asio-sys|rtsan-standalone-sys)"$' Cargo.lock; then
            echo "::error file=Cargo.lock::A dependency's build script downloads code at build time. ASIO goes through azo (decision D9), not cpal's asio feature; RealtimeSanitizer is linked by rtsan/build.rs, not rtsan-standalone."
            exit 1
          fi
          echo "No build-time downloaders in Cargo.lock"

      - name: Prepare the runner
        if: needs.changes.outputs.code == 'true'
        uses: ./.github/actions/prepare

      - name: Restore the dependency cache
        if: needs.changes.outputs.code == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # cargo-nextest's version is pinned in xtask/src/main.rs and
      # .config/nextest.toml too; keep the three in step.
      - name: Install cargo-deny and cargo-nextest
        if: needs.changes.outputs.code == 'true'
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-deny@0.20.2,cargo-nextest@0.9.146
          # A prebuilt, checksummed binary or nothing: never compile it here.
          fallback: none

      # A plug-in editor opens in a window Beatlayer owns (WP-2.10), so the
      # tests that open one need an X display, which headless Linux runners
      # don't have. Xvfb serves the rest of the job's steps. macOS and
      # Windows runners have a desktop already.
      - name: Start Xvfb (Linux)
        if: needs.changes.outputs.code == 'true' && runner.os == 'Linux'
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      # See the note at the top: a pull request tests what it changes, at
      # quick depth; everything else tests everything, at full depth.
      - name: cargo xtask check
        if: needs.changes.outputs.code == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
          BL_TEST_DEPTH: ${{ github.event_name == 'pull_request' && 'quick' || 'full' }}
          NEXTEST_PROFILE: ci
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            cargo xtask check --affected --base "origin/$BASE_REF"
          else
            cargo xtask check
          fi

  rtsan:
    name: RealtimeSanitizer (Linux x64)
    needs: changes
    # Linux only: a macOS minute counts as ten on the Free plan, and the same
    # tests run on macOS with `cargo xtask rtsan` and Homebrew's llvm.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare the runner
        if: needs.changes.outputs.code == 'true'
        uses: ./.github/actions/prepare

      # Ubuntu 24.04's own LLVM is 18, which predates RealtimeSanitizer (LLVM
      # 20). apt.llvm.org publishes LLVM 20 for Ubuntu as signed binary
      # packages; this installs the compiler-rt runtimes and, from llvm-20,
      # llvm-symbolizer, which `cargo xtask rtsan` finds next to the runtime
      # so reports name functions. Nothing downloads or builds LLVM's source,
      # and the harness's build script fails rather than fetch a runtime if
      # RTSAN_LIB_PATH is missing.
      - name: Install LLVM 20's RealtimeSanitizer runtime
        if: needs.changes.outputs.code == 'true'
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output llvm-snapshot.gpg.key https://apt.llvm.org/llvm-snapshot.gpg.key
          # apt.llvm.org's signing key, checked by fingerprint before apt
          # trusts it.
          expected=6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
          fingerprint=$(gpg --show-keys --with-colons llvm-snapshot.gpg.key | awk -F: '$1 == "fpr" { print $10; exit }')
          if [ "$fingerprint" != "$expected" ]; then
            echo "::error::apt.llvm.org's key has fingerprint ${fingerprint:-none}, not $expected"
            exit 1
          fi
          sudo install -D --mode 0644 llvm-snapshot.gpg.key /etc/apt/keyrings/apt.llvm.org.asc
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-20 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-20.list
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libclang-rt-20-dev llvm-20
          runtime=$(find /usr/lib/llvm-20 -name 'libclang_rt.rtsan*.a' -print -quit)
          if [ -z "$runtime" ]; then
            echo "::error::libclang-rt-20-dev has no RealtimeSanitizer runtime"
            exit 1
          fi
          echo "RealtimeSanitizer runtime: $runtime"
          echo "RTSAN_LIB_PATH=$runtime" >> "$GITHUB_ENV"

      # The harness builds with the main workspace's lockfile; `cargo xtask
      # rtsan` copies it too, but the cache step reads the harness first.
      - name: Give the harness the main lockfile
        if: needs.changes.outputs.code == 'true'
        run: cp Cargo.lock rtsan/Cargo.lock

      - name: Restore the dependency cache
        if: needs.changes.outputs.code == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            rtsan -> ../target/rtsan
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # --nocapture puts the sanitizer's reports from the deliberate
      # violations in the log, as evidence that it's watching.
      - name: cargo xtask rtsan
        if: needs.changes.outputs.code == 'true'
        run: cargo xtask rtsan -- --nocapture
