# Each crate's integration tests are one binary (tests/main.rs), so a test
# file is a module: filter it with test(/^<file>::/), not binary(<file>).

# cargo-nextest's settings for `cargo xtask check`, which runs the tests with
# it: every test in a process of its own, as many at once as the machine has
# cores. Doctests run separately, with `cargo test --doc`.

# Keep in step with NEXTEST_VERSION in xtask/src/main.rs and the CI workflows.
nextest-version = "0.9.146"

[profile.default]
# One run reports every failure, as `cargo test --no-fail-fast` does.
fail-fast = false

# This test times how long edits take to reach the disk; beside other tests
# it would time their load instead. It takes four test slots, which is the
# whole of a CI runner (nextest caps it at the runner's count) and leaves room
# for others on a bigger machine. It starts first, so it never waits for
# running tests to finish.
[[profile.default.overrides]]
filter = "package(bl-project) & test(=crash_recovery::edits_are_journalled_within_a_second)"
threads-required = 4
priority = 100

# These two watch for dropouts: a block whose callback takes longer than the
# block lasts. That is a wall-clock result, so beside other tests they would
# time their load instead. Each takes four test slots, the whole of a CI
# runner, so it runs with the runner to itself there; a bigger machine leaves
# room for others. They start straight after the disk test above.
[[profile.default.overrides]]
filter = """
    (package(bl-engine) & test(=playhead::the_ui_thread_sees_the_playhead_the_engine_played))
    | (package(bl-engine) & test(=stress::a_thousand_recompiles_during_playback_touch_no_heap_and_drop_no_audio))
"""
threads-required = 4
priority = 90

# The slowest tests, at either BL_TEST_DEPTH, start next, so a run doesn't
# end waiting for one that started late.
[[profile.default.overrides]]
filter = """
    (package(bl-model) & test(/^undo_properties::/))
    | (package(bl-project) & test(/^(interrupted_save|crash_recovery|round_trip)::/))
    | (package(bl-cli) & binary(cli_tests) & test(/^export::/))
    | (package(bl-engine) & binary(streaming))
    | (package(bl-ui) & test(/^zoom::/))
    | package(beatlayer)
"""
priority = 50

# CI sets NEXTEST_PROFILE=ci: a failure's output prints as it happens and
# again at the end of the log, where it's easy to find. Overrides come from
# the default profile.
[profile.ci]
failure-output = "immediate-final"
fail-fast = false
# A test that fails runs up to twice more. One that passes on a retry is
# flaky: the run passes, and the workflow's "Report flaky tests" step names
# it on the run's summary and as a warning, so it's fixed rather than
# rerun. A test that fails all three times fails the run, as before.
retries = 2

# The report reads this: target/nextest/ci/junit.xml.
[profile.ci.junit]
path = "junit.xml"
