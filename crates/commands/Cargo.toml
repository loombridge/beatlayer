[package]
name = "bl-commands"
description = "The command registry: every action a person or an agent can take, with its schema, description, permission class, contexts, and default bindings."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The registry itself is the plug-in kit's lspk-commands; this crate
# re-exports it. Its schemars is pinned, since the command reference is
# generated from its schemas.
lspk-commands.workspace = true
# The readback table is checked against JSON Schemas.
serde_json = "1"

[lints]
workspace = true
