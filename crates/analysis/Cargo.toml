[package]
autotests = false
name = "bl-analysis"
description = "Transient, tempo, key, and loudness analysis, and on-device ML features."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bl-dsp.workspace = true
bl-media.workspace = true
# The lock-free ring from the audio callback to the tempo tracker (WP-9.12), the
# version the engine's rings use.
rtrb = "0.4.0"
# Spectra for the spectrum, the onsets, and the chroma (WP-1.16). The
# version rubato's FFT resampler already brings in, so nothing new enters
# the build.
realfft = "3.5.0"
# The background pool for the analysis cache, the version bl-media's peak
# cache already uses.
rayon = "1.12.0"
# Stem separation's network (IMP-11): ONNX Runtime, whose shared library is
# loaded at run time from the packages a person downloads on first use, so
# nothing is fetched or linked at build time (`load-dynamic`, no default
# features). API 28 is ONNX Runtime 1.28, the version the packages install.
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "load-dynamic", "api-28", "coreml"], optional = true }
# The SHA-256 that names the compiled model's cache folder (R34), the version
# bl-shell checks the packages with.
sha2 = { version = "0.11", optional = true }

[dev-dependencies]
# The allocation trap and real-time sections the copy's test runs under (WP-9.12).
bl-rt.workspace = true

[features]
# Stem separation through ONNX Runtime.
stems = ["dep:ort", "dep:sha2"]

[[test]]
name = "analysis_tests"
path = "tests/main.rs"

[lints]
workspace = true
