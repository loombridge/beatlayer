[[failure]]
suite = "background"
key = "export flac 24-bit stereo"
property = "round trip keeps it"
description = "A FLAC file of the rich set's first two bars decodes 4,096 frames short: the loud block at frames 8,192 to 12,288 (peak 0.97) comes back from the decoder as nothing, and the stream after it shifts earlier. The same block written alone to a FLAC file with `AudioWriter` decodes to 0 frames, so the fault is in the FLAC encoder or the decoder reading it, not in the render, which WAV and AIFF write whole. It showed up once exports stopped starting a few frames late, which moved the audio in that block."
