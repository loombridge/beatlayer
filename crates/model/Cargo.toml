[package]
name = "bl-model"
description = "The document: tracks, clips, devices, automation, scenes, and grooves; commands, transactions, and undo."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bl-commands.workspace = true
bl-core = { workspace = true, features = ["serde", "schemars"] }
imbl = { version = "7.0.2", features = ["serde"] }
# Pinned to bl-commands' version: the command reference (docs/commands.md) is
# generated from these schemas.
schemars = { version = "=1.2.2", default-features = false, features = ["std", "derive"] }
serde = { version = "1.0.228", default-features = false, features = ["std", "derive"] }
# Commands run by ID take JSON arguments (the command registry, WP-0.14).
serde_json = "1"

[dev-dependencies]
proptest = { version = "1.11", default-features = false, features = ["std"] }
# Exact f64 round trips, which project files will need too (WP-0.7).
serde_json = { version = "1", features = ["float_roundtrip"] }

[lints]
workspace = true
