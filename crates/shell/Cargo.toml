[package]
autotests = false
name = "bl-shell"
description = "The app shell's headless half: the shell's state and commands at work (files, views, settings, the transport), the audio host running the engine, and preferences."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Measures the agent API's previews (WP-1.16), and separates stems through
# ONNX Runtime (IMP-11).
bl-analysis = { workspace = true, features = ["stems"] }
# The built-in assistant (WP-2.23): the API keys in the OS keychain, and the
# agent loop the panel runs (parts 1-2), whose tool calls the shell hosts.
bl-assistant.workspace = true
bl-audio-io.workspace = true
bl-commands.workspace = true
# What a mapped MIDI message or key does to its control (WP-7.1).
bl-control.workspace = true
# Push 2 as a control surface, offered in the Control Surfaces table (WP-7.19).
bl-push.workspace = true
# IDs for objects a command will create, which the agent API hands out.
bl-core.workspace = true
# Beatlayer's native devices, for the engines it runs and the Device View
# (WP-2.5).
bl-devices.workspace = true
# The engine the app plays the set through, and the transport's commands
# (WP-1.18), and the browser's preview voice on the audio thread with the
# drop thread that frees what it lets go of (WP-1.10). It depends on no UI
# crate.
bl-engine.workspace = true
# Standard MIDI File import and export (WP-2.21).
bl-interop.workspace = true
# Link 4.1.1: the audio host gives the engine a Link session to follow, and
# the shell switches it (WP-7.14).
bl-link.workspace = true
# The browser decodes previews and registers the files it adds to the set
# in the media store (WP-1.10).
bl-media.workspace = true
# MIDI ports and the computer MIDI keyboard (WP-2.2), and the queue they send
# the engine's processor.
bl-midi-io.workspace = true
bl-midi-tools.workspace = true
bl-model.workspace = true
# CLAP plug-ins as devices (WP-2.6): the host, whose factory goes into each
# engine's registry and whose main-thread work runs in the shell's poll.
bl-plugin-host.workspace = true
bl-project.workspace = true
bl-shell-spec.workspace = true
# The agent server's token (WP-1.15): the operating system's secure random
# source. The version egui's hashing already brings in, so nothing new enters
# the build.
getrandom = "0.3.4"
# Stem separation's packages (IMP-11): each download's SHA-256 (the version
# already in the build), and ONNX Runtime's library out of its release
# archive, a gzipped tar or, on Windows, a zip.
sha2 = "0.11"
flate2 = "1.1"
tar = { version = "0.4.46", default-features = false }
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }
serde = { version = "1.0.228", default-features = false, features = ["std", "derive"] }
serde_json = "1"
# The browser's database on disk (WP-6.31): the index of the places' files,
# the tags and tag groups, and the items that carry them. SQLite is bundled,
# so the build needs no system library; SQLite itself is public domain and
# rusqlite is MIT.
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
# The computer's name, which Link Audio's name is at first (the Link Audio
# spec, R3). Already in the lock through the window system.
gethostname = "1.1"
# Hands the engine's processor to the audio thread once the stream has
# opened at its rate: the version bl-engine uses.
rtrb = "0.4.0"

[target.'cfg(unix)'.dependencies]
# Sound analysis's thread runs at the lowest priority (sound-similarity R5).
libc = "0.2"
# How much room the filesystem has, for the DAWproject import's room check
# (the DAWproject spec, R5). Already in the lock through the window system.
rustix = { version = "1.1", default-features = false, features = ["std", "fs"] }

[target.'cfg(windows)'.dependencies]
# Sound analysis's thread runs at the lowest priority (sound-similarity R5):
# the version bl-app and bl-project already build.
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Threading"] }

# The Audio Unit editor's test drives its windows.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWindow"] }

[dev-dependencies]
# The Audio Unit host's window hooks, for the editor's test.
bl-plugin-host = { workspace = true, features = ["test-hooks"] }
# The browser's database, so the tests can read it and check what it holds.
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
# The test plug-ins, built from source, which the plug-in tests load.
bl-test-ara = { path = "../test-ara" }
bl-test-clap = { path = "../test-clap" }
bl-test-lv2 = { path = "../test-lv2" }
bl-test-vst3 = { path = "../test-vst3" }
# Standard MIDI Files the import tests generate (WP-2.21).
midly = "0.5.3"
# The allocation trap, so tests can show the audio callback stays off the
# heap (the real-time rules).
bl-rt.workspace = true
# The kit's example plug-ins for offline render tests.
bl-devices = { workspace = true, features = ["kit-examples"] }
lspk-example-gain.workspace = true
# The test tools the MIDI Tools framework's tests use (WP-6.11).
bl-midi-tools = { workspace = true, features = ["testing"] }
# The test surface, so the Control Surfaces table has a surface to run
# (WP-7.5).
bl-control = { workspace = true, features = ["testing"] }

# `au_editor` runs on the process's main thread, where Apple makes a unit's
# view controller; the test harness runs a `#[test]` on a worker thread, so
# it is a binary with the harness off instead.
[[test]]
name = "au_editor"
harness = false

[[test]]
name = "shell_tests"
path = "tests/main.rs"

[lints]
workspace = true
