# Messages sent to the controller, as hexadecimal bytes, each a whole
# system-exclusive message (F0 to F7) or a channel message. [[setup]] is sent
# when the surface starts, [[goodbye]] when it stops and [[dump]] when the
# Dump button is pressed. `bytes` is the key that holds them. This controller
# needs none, so they are commented out; for example:
#
# [[setup]]
# bytes = "F0 7D 01 F7"
