[package]
name = "bl-project"
description = "Project files: schema versions and migrations, autosave, crash recovery, and sample collection."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Crash recovery and Save Continuously register their commands (WP-1.11).
bl-commands.workspace = true
bl-core = { workspace = true, features = ["serde"] }
bl-model.workspace = true
# Pure-Rust zstd: no C toolchain, so Windows and Linux cross-checks build from
# any host, and the fuzzer instruments the decoder along with the rest of the
# loader. `hash` writes and checks the frame's content checksum.
ruzstd = { version = "=0.9.1", default-features = false, features = ["std", "hash"] }
# Pinned to bl-commands' version: the command reference is
# generated from these schemas.
schemars = { version = "=1.2.2", default-features = false, features = ["std", "derive"] }
serde = { version = "1.0.228", default-features = false, features = ["std", "derive"] }
# `float_roundtrip` parses every f64 back to the exact value that was written;
# without it, mixer and parameter values drift by one unit in the last place
# over a save and load.
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
# The local time a backup's time is shown in (file-management R18). The
# versions the app and the engine already use, so nothing new enters the
# build.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Time",
] }

[dev-dependencies]
proptest = { version = "1.11", default-features = false, features = ["std"] }

[lints]
workspace = true
