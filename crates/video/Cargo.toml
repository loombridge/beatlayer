[package]
autotests = false
name = "bl-video"
description = "Video: QuickTime movies read, frames decoded ahead of the playhead, the movie's sound through bl-media."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The movie's audio track decodes as an audio file does (R3).
bl-media.workspace = true
# Motion JPEG in Rust, so test movies decode on every computer without a
# codec (R26). Already in the lock through the image crates; MIT, Apache-2.0
# or Zlib.
zune-core = "0.5"
zune-jpeg = { version = "0.5", default-features = false, features = ["std", "x86", "neon"] }
# FFmpeg's shared libraries, opened at run time where installed (R26).
libloading = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
# CoreFoundation types for VideoToolbox, which has no Rust bindings in the
# lock: the other frameworks are declared in `videotoolbox.rs`.
core-foundation-sys = "0.8"

[target.'cfg(windows)'.dependencies]
# Media Foundation's decoders (R26).
windows = { version = "0.62", default-features = false, features = ["Win32_Media_MediaFoundation", "Win32_System_Com"] }

[dev-dependencies]
serde_json = "1"

[[test]]
name = "video_tests"
path = "tests/main.rs"

[lints]
workspace = true
