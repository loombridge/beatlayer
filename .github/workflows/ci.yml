# Runs `cargo xtask check` on Linux (x64) for every pull request, on Windows
# (x64) and Linux for every push to main, and on Windows and Linux when started
# by hand (`gh workflow run ci.yml --ref <branch>`), with macOS (arm64) too if
# the run asks for it. Alongside, it runs the real-time tests under
# RealtimeSanitizer on Linux (x64).
#
# Hosted-runner minutes are limited while the repository is private, and a
# macOS minute counts as ten Linux minutes and a Windows minute as about two.
# So per-change CI runs Linux only. Windows runs on every push to main, where a
# failure is fixed forward; start a run by hand on a branch whose change is
# Windows-specific. macOS stays out of per-change CI: every author runs the
# full check on macOS locally and pastes the summary in the pull request, and
# macos-check.yml runs it on main every night that code changed.
# The workflow also keeps the bill down by:
#
# - skipping changes that touch only Markdown, docs/, or the licence, except
#   the generated docs that `cargo xtask check` keeps in sync;
# - cancelling a run when a newer commit supersedes it;
# - restoring the dependency cache on every run, but saving it only from main,
#   so pull requests share main's cache instead of filling the 10 GB quota;
# - timing out a hung job after 30 minutes rather than the default six hours.
#
# A failure on one platform doesn't cancel the others (fail-fast is off). Most
# authors can only test macOS locally, so one run should report every
# platform's failures rather than one at a time.
#
# Every third-party action is pinned to a full commit SHA, with its version in
# a comment. Update the SHA and the comment together.

name: CI

on:
  # GitHub allows exceptions only in `paths`, not `paths-ignore`, so the
  # filter includes everything, excludes prose, then brings back the generated
  # docs that `cargo xtask check` keeps in sync with their sources. The last
  # matching pattern wins.
  pull_request:
    branches: [main]
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "!LICENSE"
      - "!.github/ISSUE_TEMPLATE/**"
      - "docs/ui-parity/**"
      - "docs/commands.md"
  push:
    branches: [main]
    # Keep in step with the list above.
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "!LICENSE"
      - "!.github/ISSUE_TEMPLATE/**"
      - "docs/ui-parity/**"
      - "docs/commands.md"
  workflow_dispatch:
    inputs:
      macos:
        description: Also run on macOS (a macOS minute costs ten Linux minutes)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Line tables keep test backtraces readable while making the target
  # directory, and so the cache, much smaller than full debug info.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  RUST_BACKTRACE: 1

jobs:
  check:
    name: check (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Linux for pull requests; Windows too on main and by hand; macOS only
        # when a manual run asks. See the note at the top.
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"name":"Linux x64","os":"ubuntu-24.04"}]' || (inputs.macos && '[{"name":"macOS arm64","os":"macos-15"},{"name":"Windows x64","os":"windows-2025"},{"name":"Linux x64","os":"ubuntu-24.04"}]' || '[{"name":"Windows x64","os":"windows-2025"},{"name":"Linux x64","os":"ubuntu-24.04"}]')) }}
    defaults:
      run:
        shell: bash
    steps:
      # rustfmt.toml asks for Unix line endings, and the Windows runner's Git
      # would otherwise check files out with CRLF, failing `cargo fmt --check`.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # cpal's `asio` feature pulls in asio-sys, whose build script downloads
      # Steinberg's ASIO SDK when CPAL_ASIO_DIR is unset. ASIO goes through
      # azo instead (decision D9). rtsan-standalone-sys clones and builds
      # LLVM's compiler-rt, or fetches prebuilt runtimes, unless it's handed
      # one; the RealtimeSanitizer harness in rtsan/ links an installed
      # runtime itself instead (WP-0.4). Add any other crate whose build
      # script downloads an SDK or binaries to the pattern.
      - name: Refuse dependencies that download at build time
        run: |
          if grep -En '^name = "(asio-sys|rtsan-standalone-sys)"$' Cargo.lock; then
            echo "::error file=Cargo.lock::A dependency's build script downloads code at build time. ASIO goes through azo (decision D9), not cpal's asio feature; RealtimeSanitizer is linked by rtsan/build.rs, not rtsan-standalone."
            exit 1
          fi
          echo "No build-time downloaders in Cargo.lock"

      - name: Prepare the runner
        uses: ./.github/actions/prepare

      - name: Restore the dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-deny
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-deny@0.20.2
          # A prebuilt, checksummed binary or nothing: never compile it here.
          fallback: none

      - name: cargo xtask check
        run: cargo xtask check

  rtsan:
    name: RealtimeSanitizer (Linux x64)
    # Linux only: a macOS minute counts as ten Linux minutes, and the same
    # tests run on macOS with `cargo xtask rtsan` and Homebrew's llvm.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare the runner
        uses: ./.github/actions/prepare

      # Ubuntu 24.04's own LLVM is 18, which predates RealtimeSanitizer (LLVM
      # 20). apt.llvm.org publishes LLVM 20 for Ubuntu as signed binary
      # packages; this installs the compiler-rt runtimes and, from llvm-20,
      # llvm-symbolizer, which `cargo xtask rtsan` finds next to the runtime
      # so reports name functions. Nothing downloads or builds LLVM's source,
      # and the harness's build script fails rather than fetch a runtime if
      # RTSAN_LIB_PATH is missing.
      - name: Install LLVM 20's RealtimeSanitizer runtime
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output llvm-snapshot.gpg.key https://apt.llvm.org/llvm-snapshot.gpg.key
          # apt.llvm.org's signing key, checked by fingerprint before apt
          # trusts it.
          expected=6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
          fingerprint=$(gpg --show-keys --with-colons llvm-snapshot.gpg.key | awk -F: '$1 == "fpr" { print $10; exit }')
          if [ "$fingerprint" != "$expected" ]; then
            echo "::error::apt.llvm.org's key has fingerprint ${fingerprint:-none}, not $expected"
            exit 1
          fi
          sudo install -D --mode 0644 llvm-snapshot.gpg.key /etc/apt/keyrings/apt.llvm.org.asc
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-20 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-20.list
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libclang-rt-20-dev llvm-20
          runtime=$(find /usr/lib/llvm-20 -name 'libclang_rt.rtsan*.a' -print -quit)
          if [ -z "$runtime" ]; then
            echo "::error::libclang-rt-20-dev has no RealtimeSanitizer runtime"
            exit 1
          fi
          echo "RealtimeSanitizer runtime: $runtime"
          echo "RTSAN_LIB_PATH=$runtime" >> "$GITHUB_ENV"

      # The harness builds with the main workspace's lockfile; `cargo xtask
      # rtsan` copies it too, but the cache step reads the harness first.
      - name: Give the harness the main lockfile
        run: cp Cargo.lock rtsan/Cargo.lock

      - name: Restore the dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            rtsan -> ../target/rtsan
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # --nocapture puts the sanitizer's reports from the deliberate
      # violations in the log, as evidence that it's watching.
      - name: cargo xtask rtsan
        run: cargo xtask rtsan -- --nocapture
