[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# Spikes are throwaway experiments with their own lockfiles (WP-0.8a, 0.8b).
# `rtsan` is the RealtimeSanitizer harness, a workspace of its own so that
# nothing able to fetch LLVM is ever in this workspace's graph (WP-0.4).
exclude = ["xtask/fixtures", "spikes", "rtsan"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
# Nothing is published to crates.io until the trademark search is done.
publish = false

[workspace.dependencies]
bl-core = { path = "crates/core" }
bl-model = { path = "crates/model" }
bl-commands = { path = "crates/commands" }
bl-project = { path = "crates/project" }
bl-dsp = { path = "crates/dsp" }
bl-engine = { path = "crates/engine" }
bl-audio-engine = { path = "crates/audio-engine" }
bl-devices = { path = "crates/devices" }
bl-stretch = { path = "crates/stretch" }
bl-media = { path = "crates/media" }
bl-analysis = { path = "crates/analysis" }
bl-plugin-host = { path = "crates/plugin-host" }
bl-audio-io = { path = "crates/audio-io" }
bl-rt = { path = "crates/rt" }
bl-midi-io = { path = "crates/midi-io" }
bl-control = { path = "crates/control" }
bl-link = { path = "crates/link" }
bl-interop = { path = "crates/interop" }
bl-ui = { path = "crates/ui" }
bl-shell = { path = "crates/shell" }
bl-shell-spec = { path = "crates/shell-spec" }
bl-agent = { path = "crates/agent" }
bl-assistant = { path = "crates/assistant" }
# The plug-in kit, by git revision until its API settles: a merge commit on
# its main branch, so the revision stays reachable.
lspk-rt = { git = "https://github.com/loombridge/plugin-kit", rev = "fbf23cd99a14cbfff7f5246f1cd3af526380073b" }
lspk-params = { git = "https://github.com/loombridge/plugin-kit", rev = "fbf23cd99a14cbfff7f5246f1cd3af526380073b" }
lspk-commands = { git = "https://github.com/loombridge/plugin-kit", rev = "fbf23cd99a14cbfff7f5246f1cd3af526380073b" }
lspk-agent = { git = "https://github.com/loombridge/plugin-kit", rev = "fbf23cd99a14cbfff7f5246f1cd3af526380073b" }
# The format layer: kit plug-ins compiled in as native devices (bl-devices),
# and the host side of its agent-commands CLAP extension (bl-plugin-host).
lspk-plugin = { git = "https://github.com/loombridge/plugin-kit", rev = "fbf23cd99a14cbfff7f5246f1cd3af526380073b", default-features = false }
lspk-plugin-agent = { git = "https://github.com/loombridge/plugin-kit", rev = "fbf23cd99a14cbfff7f5246f1cd3af526380073b" }
# The kit's DSP, voice management and wavetables, for the native polysynth
# (WP-2.17): zero-delay-feedback filters and envelopes, polyphonic voices,
# and band-limited oscillators.
lspk-dsp = { git = "https://github.com/loombridge/plugin-kit", rev = "fbf23cd99a14cbfff7f5246f1cd3af526380073b" }
lspk-voice = { git = "https://github.com/loombridge/plugin-kit", rev = "fbf23cd99a14cbfff7f5246f1cd3af526380073b" }
lspk-wavetable = { git = "https://github.com/loombridge/plugin-kit", rev = "fbf23cd99a14cbfff7f5246f1cd3af526380073b" }
# The kit's example plug-ins, as native devices behind bl-devices' `kit-examples`
# feature, without their own exports.
lspk-example-gain = { git = "https://github.com/loombridge/plugin-kit", rev = "fbf23cd99a14cbfff7f5246f1cd3af526380073b", default-features = false }
lspk-example-sine = { git = "https://github.com/loombridge/plugin-kit", rev = "fbf23cd99a14cbfff7f5246f1cd3af526380073b", default-features = false }

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "deny"
# `lspk_rtsan` is set only by the RealtimeSanitizer harness in `rtsan/`.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(lspk_rtsan)"] }
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"

# Debug and test builds are lightly optimised, with line tables only for
# Beatlayer's crates and no debug info for dependencies. Unoptimised, every
# test binary carried the whole app (a 165 MB binary for the app's tests), and
# a worktree's 1,700 test binaries filled 170 GB; at opt-level 1 that binary is
# 79 MB and the tests run faster. Backtraces still name the file and line, and
# debug assertions and overflow checks stay on (23 October 2026).
[profile.dev]
opt-level = 1
debug = "line-tables-only"
[profile.dev.package."*"]
debug = false

# Decoding and sample-rate conversion run optimised in debug and test builds
# too, so those builds stream audio from disk in real time (WP-1.3).
# Unoptimised, they take about 2 ms to decode and convert a 4,096-frame
# block, which can't keep 64 streams fed. bl-media is on the list because
# the converter's sample adapters are compiled where they're used, there.
[profile.dev.package.bl-media]
opt-level = 3
# Analysis (WP-1.16) too: the agent API's tests measure minutes of audio,
# and its true-peak interpolator and FFTs are a hundred times slower
# unoptimised.
[profile.dev.package.bl-analysis]
opt-level = 3
# The warp modes (WP-4.19) too: the measurement tests render every mode at
# five speeds and four transpositions, minutes of grains and spectral blocks
# that take several times longer unoptimised.
[profile.dev.package.bl-stretch]
opt-level = 3
# The plug-in kit's DSP, voice manager and wavetable oscillators too (the
# polysynth, WP-2.17): the voice-budget test measures the device, not an
# unoptimised build, and a debug build plays a polyphonic patch in real time.
[profile.dev.package.lspk-dsp]
opt-level = 3
[profile.dev.package.lspk-voice]
opt-level = 3
[profile.dev.package.lspk-wavetable]
opt-level = 3
[profile.dev.package.symphonia]
opt-level = 3
[profile.dev.package.symphonia-core]
opt-level = 3
[profile.dev.package.symphonia-common]
opt-level = 3
[profile.dev.package.symphonia-metadata]
opt-level = 3
[profile.dev.package.symphonia-format-riff]
opt-level = 3
[profile.dev.package.symphonia-format-ogg]
opt-level = 3
[profile.dev.package.symphonia-format-isomp4]
opt-level = 3
[profile.dev.package.symphonia-codec-pcm]
opt-level = 3
[profile.dev.package.symphonia-codec-adpcm]
opt-level = 3
[profile.dev.package.symphonia-codec-alac]
opt-level = 3
[profile.dev.package.symphonia-codec-aac]
opt-level = 3
[profile.dev.package.symphonia-codec-vorbis]
opt-level = 3
[profile.dev.package.symphonia-bundle-flac]
opt-level = 3
[profile.dev.package.symphonia-bundle-mp3]
opt-level = 3
[profile.dev.package.rubato]
opt-level = 3
[profile.dev.package.audioadapter]
opt-level = 3
[profile.dev.package.audioadapter-buffers]
opt-level = 3
[profile.dev.package.realfft]
opt-level = 3
[profile.dev.package.rustfft]
opt-level = 3
# Agent perception (WP-2.28): base64-encoding 30-second audio preview payloads
# (5–12 MB) in tool results takes ~300 ms unoptimised, stalling the main thread.
# Optimised, it takes under 15 ms.
[profile.dev.package.lspk-agent]
opt-level = 3

