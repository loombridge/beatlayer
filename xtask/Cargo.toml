[package]
name = "xtask"
description = "Repository tasks: `cargo xtask check` and friends."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Builds the command registry to check it and generate docs/commands.md
# (WP-0.14). Headless crates only: xtask never links a UI crate.
bl-commands.workspace = true
# The transport's commands (WP-1.5).
bl-engine.workspace = true
bl-model.workspace = true
serde_json = "1"
# Reads docs/ui-parity/shortcuts.toml. Parsing only: no serde derive, no writer.
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }

[lints]
workspace = true
