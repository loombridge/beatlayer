# Beatlayer's default keymap: Live 12's shortcuts (D16).
#
# Generated by `cargo xtask keymap` from the shortcut reference and the
# command registry. Don't edit it by hand: `cargo xtask check` fails if it
# differs from what they generate. Each shortcut's `status` says what it does:
# `bound` (the commands it runs, each in the contexts listed), `system` (the
# platform handles it), `widget` (the focused control does), or `pending`
# (nothing yet; the milestone binds it, and `package` names the package for M1).

schema = 1
live_version = "12.4.3"
