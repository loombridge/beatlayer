[package]
name = "beatlayer"
description = "The Beatlayer application: wiring, windows, menus, and preferences."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bl-core.workspace = true
bl-model.workspace = true
bl-project.workspace = true
bl-dsp.workspace = true
bl-engine.workspace = true
bl-devices.workspace = true
bl-stretch.workspace = true
bl-media.workspace = true
bl-analysis.workspace = true
bl-plugin-host.workspace = true
bl-audio-io.workspace = true
bl-midi-io.workspace = true
bl-control.workspace = true
bl-link.workspace = true
bl-interop.workspace = true
bl-shell.workspace = true
bl-ui.workspace = true
# The window: egui driven through egui-winit and egui-wgpu from Beatlayer's
# own winit event loop (ADR-001). All pinned exactly and upgraded together,
# with the features the egui spike (WP-0.8b) proved against deny.toml:
# no egui default fonts (the UI bundles its own), and winit's Wayland
# decorations without title text (the titled variant pulls in an
# unmaintained crate).
egui = { version = "=0.36.2", default-features = false }
egui-winit = { version = "=0.36.2", default-features = false, features = [
    "accesskit",
    "clipboard",
    "wayland",
    "x11",
] }
egui-wgpu = { version = "=0.36.2", default-features = false, features = [
    "winit",
    "wayland",
    "x11",
    "macos-window-resize-jitter-fix",
] }
winit = { version = "=0.30.13", default-features = false, features = [
    "rwh_06",
    "x11",
    "wayland",
    "wayland-dlopen",
    "wayland-csd-adwaita-notitle",
] }
# The GPU backends egui-wgpu draws with.
wgpu = { version = "=30.0.1", default-features = false, features = [
    "std",
    "parking_lot",
    "metal",
    "dx12",
    "vulkan",
    "wgsl",
] }
pollster = "0.4"
# File dialogs (open, save as) and message boxes (save changes?, About).
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal"] }
# Writes `--screenshot` captures of Beatlayer's own window.
png = "0.18"
serde_json = "1"

# Native menus on macOS and Windows; Linux draws its menu bar with egui,
# because muda's Linux menus need GTK windows.
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
muda = { version = "=0.21.2", default-features = false }
raw-window-handle = "0.6"

[lints]
workspace = true

# Packaging with cargo-packager (decision D15). This table is the whole
# configuration; run it with `cargo xtask package`, which adds the version, the
# build and output directories, and the signing identity when the signing
# secrets exist (H4, H5). Paths are relative to this file.
[package.metadata.packager]
product-name = "Beatlayer"
identifier = "io.loombridge.beatlayer"
publisher = "Loombridge"
description = "An open-source digital audio workstation."
copyright = "Copyright © 2026 the Beatlayer contributors. Licensed under GPL-3.0-or-later."
category = "Music"
binaries = [{ path = "beatlayer", main = true }, { path = "bl-cli" }]
icons = [
    "packaging/icons/icon.icns",
    "packaging/icons/icon.ico",
    "packaging/icons/*.png",
]
# The GPL travels with the binaries, and the OFL with the bundled typeface.
resources = [
    "../../LICENSE",
    "../../README.md",
    "../ui/fonts/inter/LICENSE.txt",
]

[package.metadata.packager.macos]
minimum-system-version = "13.0"
# Merged over the generated Info.plist: architecture, microphone use, and the
# project document type.
info-plist-path = "packaging/macos/Info.plist"
entitlements = "packaging/macos/entitlements.plist"
