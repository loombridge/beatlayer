[[shortcut]]
id = "S-EDIT-009"
action = "Select everything in the focused view"
context = "global"
kind = "key"
trigger = "press"
milestone = "M1"
mac = ["Cmd+A"]
win = ["Ctrl+A"]
status = "bound"
commands = [
  { id = "arrangement.select_all", contexts = ["arrangement"] },
  { id = "clip_view.select_notes", contexts = ["note-editor", "note-selection"], args = { select = "all" } },
]

[[shortcut]]
id = "S-EDIT-010"
action = "Add or remove one item from the selection"
context = "global"
kind = "mouse"
trigger = "press"
milestone = "M1"
mac = ["Cmd+click"]
win = ["Ctrl+click"]
status = "bound"
commands = [
  { id = "arrangement.select_clips", contexts = ["arrangement"], args = { mode = "toggle" } },
]

[[shortcut]]
id = "S-EDIT-011"
action = "Select a range from the first to the last clicked item"
context = "global"
kind = "mouse"
trigger = "press"
milestone = "M1"
mac = ["Shift+click"]
win = ["Shift+click"]
status = "bound"
commands = [
  { id = "arrangement.select_clips", contexts = ["arrangement"], args = { mode = "extend" } },
]

[[shortcut]]
id = "S-EDIT-012"
action = "While renaming, move to the next track or scene"
context = "text-field"
kind = "key"
trigger = "press"
milestone = "M1"
mac = ["Tab"]
win = ["Tab"]
status = "pending"
package = "WP-1.8b"

[[shortcut]]
id = "S-EDIT-013"
action = "Ignore grid snapping while dragging"
context = "global"
kind = "modifier"
trigger = "held"
milestone = "M1"
mac = ["Cmd (hold while dragging)"]
win = ["Alt (hold while dragging)"]
status = "widget"
handler = "the Arrangement View: Cmd (Alt) held while dragging clips or their edges ignores snapping, or snaps with it off (`arrangement.move_clips`, `arrangement.resize_clips`)"

[[shortcut]]
id = "S-EDIT-014"
action = "Apply an editing command to clips and slots across all tracks"
context = "session"
kind = "modifier"
trigger = "held"
milestone = "M3"
mac = ["Shift (with the command)"]
win = ["Shift (with the command)"]
status = "widget"
handler = "the Session View: Shift with Cut, Copy, Paste or Duplicate is S-SES-029 to S-SES-032, which run `session.cut`, `session.copy`, `session.paste` and `session.duplicate` with `all_tracks` (the session view spec, R42)"

[[shortcut]]
id = "S-EDIT-015"
action = "Apply an editing command to time across all tracks"
context = "arrangement"
kind = "modifier"
trigger = "held"
milestone = "M6"
mac = ["Shift (with the command)"]
win = ["Shift (with the command)"]
status = "widget"
handler = "the Arrangement: Shift with Cut, Copy, Paste, Duplicate or Delete is S-ARR-015 to S-ARR-019, which run `arrangement.cut_time`, `arrangement.copy_time`, `arrangement.paste_time`, `arrangement.duplicate_time` and `arrangement.delete_time` (the time editing spec, R21)"

[[shortcut]]
id = "S-EDIT-016"
action = "Apply an editing command to the selected part of an envelope"
context = "envelope"
kind = "modifier"
trigger = "held"
milestone = "M2"
mac = ["Option (with the command)"]
win = ["Alt (with the command)"]
status = "widget"
handler = "the Arrangement's automation lane: the edit keys with Option (Alt on Windows) held apply to the envelopes (the automation editing spec, R6)"
