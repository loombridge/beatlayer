[package]
name = "bl-shell"
description = "The app shell's headless half: app commands (files, views, settings), the audio host, the menu bar model, and preferences."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bl-audio-io.workspace = true
bl-commands.workspace = true
bl-model.workspace = true
# Pinned to bl-commands' version: the command reference (docs/commands.md) is
# generated from these schemas.
schemars = { version = "=1.2.2", default-features = false, features = ["std", "derive"] }
serde = { version = "1.0.228", default-features = false, features = ["std", "derive"] }
serde_json = "1"

[lints]
workspace = true
