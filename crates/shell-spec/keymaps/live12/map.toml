# A part of Beatlayer's default keymap, generated by `cargo xtask keymap`; don't edit it by hand.

[[shortcut]]
id = "S-MAP-001"
action = "Turn MIDI Map Mode on or off"
context = "global"
kind = "key"
trigger = "press"
milestone = "M7"
mac = ["Cmd+M"]
win = ["Ctrl+M"]
status = "bound"
commands = [
  { id = "remote.map_mode", contexts = ["global"], args = { mode = "midi", toggle = true } },
]

[[shortcut]]
id = "S-MAP-002"
action = "Turn Key Map Mode on or off"
context = "global"
kind = "key"
trigger = "press"
milestone = "M7"
mac = ["Cmd+K"]
win = ["Ctrl+K"]
status = "bound"
commands = [
  { id = "remote.map_mode", contexts = ["global"], args = { mode = "key", toggle = true } },
]

[[shortcut]]
id = "S-MAP-003"
action = "Turn the computer MIDI keyboard on or off"
context = "global"
kind = "key"
trigger = "press"
milestone = "M2"
mac = ["M"]
win = ["M"]
status = "bound"
commands = [
  { id = "midi.toggle_computer_keyboard", contexts = ["global"] },
]

[[shortcut]]
id = "S-MAP-004"
action = "Shift the computer keyboard's octave down or up"
context = "computer-midi-keyboard"
kind = "key"
trigger = "press"
milestone = "M2"
mac = ["Z", "X"]
win = ["Z", "X"]
status = "widget"
handler = "while the computer MIDI keyboard is on, Z and X move its octave (`midi.computer_keyboard_octave`)"

[[shortcut]]
id = "S-MAP-005"
action = "Lower or raise the computer keyboard's note velocity"
context = "computer-midi-keyboard"
kind = "key"
trigger = "press"
milestone = "M2"
mac = ["C", "V"]
win = ["C", "V"]
status = "widget"
handler = "while the computer MIDI keyboard is on, C and V step its velocity (`midi.computer_keyboard_velocity`)"

[[shortcut]]
id = "S-MAP-006"
action = "Play notes from the letter keys (white keys on the home row, black keys above)"
context = "computer-midi-keyboard"
kind = "key"
trigger = "held"
milestone = "M2"
mac = ["A", "W", "S", "E", "D", "F", "T", "G", "Y", "H", "U", "J", "K", "O", "L", "P"]
win = ["A", "W", "S", "E", "D", "F", "T", "G", "Y", "H", "U", "J", "K", "O", "L", "P"]
status = "widget"
handler = "while the computer MIDI keyboard is on, its note keys play and release notes (`midi.computer_keyboard_key`)"

[[shortcut]]
id = "S-MAP-007"
action = "Use a single-letter shortcut while the computer keyboard is on"
context = "computer-midi-keyboard"
kind = "modifier"
trigger = "held"
milestone = "M2"
mac = ["Shift (with the letter)"]
win = ["Shift (with the letter)"]
status = "widget"
handler = "while the computer MIDI keyboard is on, a letter with Shift runs its shortcut as it would with the keyboard off"
