[package]
name = "bl-ui"
description = "Views, widgets, GPU canvases, theming, and accessibility."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# The code is GPL-3.0-or-later; the bundled Inter typeface (fonts/inter) is
# OFL-1.1, which deny.toml allows for fonts.
license = "GPL-3.0-or-later AND OFL-1.1"
publish.workspace = true

[dependencies]
bl-commands.workspace = true
bl-core.workspace = true
# The multisampler's parameter IDs, for the zone editor's header (WP-5.13).
bl-devices.workspace = true
bl-model.workspace = true
bl-engine.workspace = true
bl-shell.workspace = true
# Waveform peaks for the Arrangement View (WP-1.8a): the layout the shader
# reads, and the background cache that builds them.
bl-media.workspace = true
# The Arrangement View draws its lanes through its own wgpu pipelines in an
# egui paint callback (ADR-001). The versions and features the app already
# uses, so nothing new enters the build.
bytemuck = { version = "1.25", features = ["derive"] }
egui-wgpu = { version = "=0.36.2", default-features = false }
# Pinned exactly and upgraded deliberately (ADR-001). Without
# `default_fonts`: epaint_default_fonts' licences fail deny.toml, and the UI
# bundles its own typeface. AccessKit is always on in egui 0.36.
egui = { version = "=0.36.2", default-features = false }
serde = { version = "1.0.228", default-features = false, features = ["std", "derive"] }
serde_json = "1"
# Reads the keymap and the theme files. Parsing only.
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }

[dev-dependencies]
# The null device and its channels, for the In/Out choosers' tests
# (WP-2.13).
bl-audio-io.workspace = true
# The assistant loop's scripted provider, so the Agents page's activity log
# tests can fill it through a real turn (WP-2.23, part 4).
bl-assistant.workspace = true
# The device framework's test devices, for the generic UI's tests (WP-2.5).
# The test MIDI backend, and the queue the computer MIDI keyboard fills, for
# the MIDI input tests (WP-2.2).
bl-midi-io.workspace = true
rtrb = "0.4.0"
# Every registered command, for the keyboard-reachability test (WP-1.14),
# which walks the whole registry the command reference lists.
bl-project.workspace = true
# The Arrangement benchmark (examples/arrangement_bench.rs) renders offscreen
# on the GPU, with the backends the app uses, and can save a frame as a PNG.
png = "0.18"
pollster = "0.4"
wgpu = { version = "=30.0.1", default-features = false, features = [
    "std",
    "parking_lot",
    "metal",
    "dx12",
    "vulkan",
    "wgsl",
] }

# The benchmark reads the main thread's CPU time, as the UI spikes did.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[lints]
workspace = true
