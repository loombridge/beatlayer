[package]
name = "bl-rt"
description = "The real-time thread harness: priority, audio workgroups, denormal flushing, the allocation trap, a lock-free logger, and RealtimeSanitizer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The harness itself is the plug-in kit's lspk-rt; this crate re-exports it,
# so Beatlayer's crates keep using `bl_rt`. RealtimeSanitizer has no feature
# and no dependency: the harness in `rtsan/`, a workspace of its own, builds
# lspk-rt with `--cfg lspk_rtsan` and links a runtime already installed on
# the machine.

[dependencies]
lspk-rt.workspace = true

[lints]
workspace = true
