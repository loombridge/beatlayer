[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# Spikes are throwaway experiments with their own lockfiles (WP-0.8a, 0.8b).
# `rtsan` is the RealtimeSanitizer harness, a workspace of its own so that
# nothing able to fetch LLVM is ever in this workspace's graph (WP-0.4).
exclude = ["xtask/fixtures", "spikes", "rtsan"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
# Nothing is published to crates.io until the trademark search (H9) is done.
publish = false

[workspace.dependencies]
bl-core = { path = "crates/core" }
bl-model = { path = "crates/model" }
bl-commands = { path = "crates/commands" }
bl-project = { path = "crates/project" }
bl-dsp = { path = "crates/dsp" }
bl-engine = { path = "crates/engine" }
bl-devices = { path = "crates/devices" }
bl-stretch = { path = "crates/stretch" }
bl-media = { path = "crates/media" }
bl-analysis = { path = "crates/analysis" }
bl-plugin-host = { path = "crates/plugin-host" }
bl-audio-io = { path = "crates/audio-io" }
bl-rt = { path = "crates/rt" }
bl-midi-io = { path = "crates/midi-io" }
bl-control = { path = "crates/control" }
bl-link = { path = "crates/link" }
bl-interop = { path = "crates/interop" }
bl-ui = { path = "crates/ui" }
bl-shell = { path = "crates/shell" }
bl-shell-spec = { path = "crates/shell-spec" }

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "deny"
# `bl_rtsan` is set only by the RealtimeSanitizer harness in `rtsan/`.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(bl_rtsan)"] }
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"

# Decoding and sample-rate conversion run optimised in debug and test builds
# too, so those builds stream audio from disk in real time (WP-1.3).
# Unoptimised, they take about 2 ms to decode and convert a 4,096-frame
# block, which can't keep 64 streams fed. bl-media is on the list because
# the converter's sample adapters are compiled where they're used, there.
[profile.dev.package.bl-media]
opt-level = 3
[profile.dev.package.symphonia]
opt-level = 3
[profile.dev.package.symphonia-core]
opt-level = 3
[profile.dev.package.symphonia-common]
opt-level = 3
[profile.dev.package.symphonia-metadata]
opt-level = 3
[profile.dev.package.symphonia-format-riff]
opt-level = 3
[profile.dev.package.symphonia-format-ogg]
opt-level = 3
[profile.dev.package.symphonia-format-isomp4]
opt-level = 3
[profile.dev.package.symphonia-codec-pcm]
opt-level = 3
[profile.dev.package.symphonia-codec-adpcm]
opt-level = 3
[profile.dev.package.symphonia-codec-alac]
opt-level = 3
[profile.dev.package.symphonia-codec-aac]
opt-level = 3
[profile.dev.package.symphonia-codec-vorbis]
opt-level = 3
[profile.dev.package.symphonia-bundle-flac]
opt-level = 3
[profile.dev.package.symphonia-bundle-mp3]
opt-level = 3
[profile.dev.package.rubato]
opt-level = 3
[profile.dev.package.audioadapter]
opt-level = 3
[profile.dev.package.audioadapter-buffers]
opt-level = 3
[profile.dev.package.realfft]
opt-level = 3
[profile.dev.package.rustfft]
opt-level = 3
