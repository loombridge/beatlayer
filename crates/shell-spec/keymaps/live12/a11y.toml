# A part of Beatlayer's default keymap, generated by `cargo xtask keymap`; don't edit it by hand.

[[shortcut]]
id = "S-A11Y-001"
action = "Move the insert marker to the previous or next clip edge or locator"
context = "arrangement"
kind = "key"
trigger = "press"
milestone = "M1"
mac = ["Option+Left", "Option+Right"]
win = ["Ctrl+Left", "Ctrl+Right"]
status = "widget"
handler = "the Arrangement View: Option-Left and Option-Right (Alt) move the insert marker to the previous or next clip edge or locator (`arrangement.set_insert_marker`)"

[[shortcut]]
id = "S-A11Y-002"
action = "Extend or shorten the selection"
context = "arrangement"
kind = "key"
trigger = "press"
milestone = "M1"
mac = ["Shift+Left", "Shift+Right", "Shift+Up", "Shift+Down"]
win = ["Shift+Left", "Shift+Right", "Shift+Up", "Shift+Down"]
status = "widget"
handler = "the Arrangement View: Shift with Left or Right moves the time selection's end a grid step, with Up or Down takes in the track above or below (`arrangement.select_time`)"

[[shortcut]]
id = "S-A11Y-003"
action = "Move between tracks"
context = "arrangement"
kind = "key"
trigger = "press"
milestone = "M1"
mac = ["Up", "Down"]
win = ["Up", "Down"]
status = "widget"
handler = "the Arrangement View: Up and Down select the track above or below (`arrangement.select_tracks`)"

