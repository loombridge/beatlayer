[package]
autotests = false
name = "bl-devices"
description = "Native instruments, audio effects, and MIDI effects."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The plug-in kit's example plug-ins, Example Gain and Example Sine, as native
# devices: they prove the kit adapter. Off by default, so nothing user-facing
# ships.
kit-examples = ["dep:lspk-example-gain", "dep:lspk-example-sine"]

[dependencies]
bl-commands.workspace = true
bl-core.workspace = true
bl-dsp.workspace = true
bl-engine.workspace = true
# A device that plays media (WP-2.16) reads the decoded audio the media
# store hands the engine, as `SampleData`.
bl-media.workspace = true
# Arpeggiator and the Arpeggiate tool share one style order, and Chord and
# the Strum tool one strum law.
bl-midi-tools.workspace = true
# Devices' parameter descriptors and layouts are the document's types
# (WP-2.5), so the shell, the UI, and presets read them too.
bl-model.workspace = true
# Plug-ins built on the plug-in kit, compiled in (`kit`): the `Plugin` trait,
# without its formats.
lspk-plugin.workspace = true
# The kit's DSP for the native polysynth (WP-2.17): envelopes, zero-delay
# feedback filters and polyphonic voice management, and its band-limited
# wavetable oscillators.
lspk-dsp.workspace = true
lspk-voice.workspace = true
lspk-wavetable.workspace = true
# The factory wavetables' sines, powers and floors, which must come out the
# same on every platform (the wavetable spec, R2).
libm = { version = "0.2.16", default-features = false }
lspk-example-gain = { workspace = true, optional = true }
lspk-example-sine = { workspace = true, optional = true }
# A kit device's processor reaches its node through a one-slot queue: the
# version bl-engine uses.
rtrb = "0.4.0"
serde_json = "1"

[dev-dependencies]
# Every block in the tests runs as a real-time section under the
# allocation trap.
bl-rt.workspace = true
# The kit adapter's tests run the kit's example plug-ins.
lspk-example-gain.workspace = true
lspk-example-sine.workspace = true
# The polysynth's aliasing test measures the spectrum with an FFT, the
# version the analysis and media crates already bring in.
realfft = "3.5.0"

[[test]]
name = "devices_tests"
path = "tests/main.rs"

# Electric against the device budget, run by hand: `cargo bench -p bl-devices --bench electric`.
[[bench]]
name = "electric"
harness = false

[lints]
workspace = true
