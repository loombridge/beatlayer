# A part of Beatlayer's default keymap, generated by `cargo xtask keymap`; don't edit it by hand.

[[shortcut]]
id = "S-DEV-001"
action = "Group the selected devices into a rack"
context = "device-view"
kind = "key"
trigger = "press"
milestone = "M5"
mac = ["Cmd+G"]
win = ["Ctrl+G"]
status = "bound"
commands = [
  { id = "device.group", contexts = ["device-view"] },
]

[[shortcut]]
id = "S-DEV-002"
action = "Ungroup the selected rack"
context = "device-view"
kind = "key"
trigger = "press"
milestone = "M5"
mac = ["Cmd+Shift+G"]
win = ["Ctrl+Shift+G"]
status = "bound"
commands = [
  { id = "device.ungroup", contexts = ["device-view"] },
]

