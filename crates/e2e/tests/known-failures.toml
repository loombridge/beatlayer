# Failures the end-to-end suite has found in Beatlayer that aren't fixed yet.
#
# A sweep goes on past a listed failure, and fails on any failure that isn't
# listed and on any listed entry whose check now passes: a fix deletes its
# entry in the same change. Every entry is a real, reproducible bug in
# Beatlayer, never a gap in the harness (a harness bug is fixed in the
# harness). `bl_e2e::known` reads this file.
#
# Each entry is a [[failure]] table with four fields, all required:
#
#   suite        the test family that finds it: commands, devices,
#                live_offline, background, round_trips, scenarios or smoke
#   key          what was checked: a command ID, a device type and parameter
#                name, or a scenario's step
#   property     the property that doesn't hold, as the suite names it
#   description  the bug in plain words: what was done, what was expected,
#                what happened
#
# For example:
#
#   [[failure]]
#   suite = "devices"
#   key = "beatlayer.grit/Drive"
#   property = "level bounded"
#   description = "At its maximum the output rises 30 dB above the default setting."

[[failure]]
suite = "smoke"
key = "export.audio in the app, allowed by the person"
property = "the call answers with the export's result"
description = "With the app's window open and the agent not autonomous, an agent's export.audio asks the person first; once allowed, the call fails with \"the call asked twice\" although the export starts, runs and writes its file. The agent never hears the result. Without a window (bl-cli mcp), or with autonomous mode on, the same call answers."

[[failure]]
suite = "scenarios"
key = "remix/slice to a drum rack"
property = "the sliced rack plays the loop as the warped clip did"
description = "A one-bar drum loop at 120 BPM, warped in Beats mode in a 90 BPM song, sliced to a new MIDI track by transients with Preserve warped timing on: the rack's rendered slices don't sound as the clip plays (envelope correlation 0.16 with the clip's own export, 0.81 with the loop unstretched). The slice render reads the plain media store, without the analysed transients Beats cuts at, so it cuts at the warp markers alone. Re-Pitch and Complex slice correctly."

[[failure]]
suite = "scenarios"
key = "mix/freeze"
property = "the set with a frozen MIDI track keeps the model's rules"
description = "Freezing a MIDI track (Cascade and Auto Filter, a two-bar clip) puts the freeze file's audio into the track's clips, so the document holds audio clips on a MIDI track, which Document::check_invariants refuses: \"track is a MIDI track; this needs an audio track\". The loader's clip-kind check makes no exception for a frozen track."

[[failure]]
suite = "scenarios"
key = "mix/freeze"
property = "the set with a frozen MIDI track saves and reopens"
description = "A set holding a frozen MIDI track saves, but set.open refuses the file: \"the set isn't valid: track is a MIDI track; this needs an audio track\". Frozen clips hold audio data while their track is MIDI, and loading checks each clip's kind against its track's without regard to the freeze, so the saved set can't be opened again."
