[package]
name = "bl-shell"
description = "The app shell's headless half: the shell's state and commands at work (files, views, settings), the audio host, and preferences."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bl-audio-io.workspace = true
bl-commands.workspace = true
bl-core.workspace = true
# The browser's preview voice on the audio thread, and the drop thread that
# frees what it lets go of (WP-1.10).
bl-engine.workspace = true
# The browser decodes previews and registers the files it adds to the set
# in the media store (WP-1.10).
bl-media.workspace = true
bl-model.workspace = true
bl-project.workspace = true
bl-shell-spec.workspace = true
serde = { version = "1.0.228", default-features = false, features = ["std", "derive"] }
serde_json = "1"

[dev-dependencies]
# The allocation trap, so tests can show the audio callback stays off the
# heap (the real-time rules).
bl-rt.workspace = true

[lints]
workspace = true
