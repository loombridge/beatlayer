[package]
name = "bl-cli"
description = "Headless tool: render, inspect, convert, and benchmark projects, and serve the agent API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# ASIO devices in `bl-cli devices` and `bl-cli tone` (Windows only).
asio = ["bl-audio-io/asio"]

[dependencies]
# `bl-cli mcp`: the agent API over stdio, on a headless shell (WP-1.15).
bl-agent.workspace = true
bl-shell.workspace = true
bl-project.workspace = true
bl-engine.workspace = true
# `bl-cli device-changes`: the engine on a device through device changes.
bl-audio-engine.workspace = true
bl-devices.workspace = true
bl-audio-io.workspace = true
bl-core.workspace = true
bl-model.workspace = true
# `render` finds a set's audio files through the media store, and the golden
# fixtures decode the files they make (WP-1.4).
bl-media.workspace = true
bl-rt.workspace = true
# The golden fixtures' audio files are sine chirps from libm's pure-Rust
# sine, so they're the same to the bit on every platform (WP-1.4), as the
# engine's test tone is.
libm = { version = "0.2.16", default-features = false }
clap = { version = "4.6.7", features = ["derive"] }
# Hands `engine-smoke`'s engine to the stream's callback once the stream has
# opened at the device's rate.
rtrb = "0.4.0"
# `render` writes WAV files (the architecture's WAV encoder).
hound = "3.5.1"
# The golden references: FLAC, written by the architecture's FLAC encoder and
# read back by an independent decoder, so a reference is checked by a second
# implementation of the format. Both are pure Rust. No default features for
# the encoder: no logging, no threads, no serde.
flacenc = { version = "0.5.1", default-features = false }
claxon = "0.4.3"
# The golden references' manifest.
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
# The agent API's tests hash generated stems as importing them would.
bl-media.workspace = true
# The test plug-in, built from source, which `bl-cli export` renders with
# (WP-2.6b).
bl-test-clap = { path = "../test-clap" }
# The agent API's MIDI file tests write and read Standard MIDI Files
# (WP-2.21).
bl-interop.workspace = true

[lints]
workspace = true

# The library holds `render` and the golden-test harness, which the binary
# and the integration tests share. The binary's own documentation would
# collide with the library's, which has the same name.
[[bin]]
name = "bl-cli"
path = "src/main.rs"
doc = false
