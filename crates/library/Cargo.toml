[package]
name = "bl-library"
description = "Beatlayer's library as data: the manifest under library/, its licence checks, the packages built from it, and the credits of their items."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Data and files only: no audio, no UI. `xtask` builds the packages through
# this crate and `bl-shell` reads the installed ones, so the format has one
# definition (WP-9.46).
[dependencies]
# The packages are deterministic gzipped tar archives, as the Packages
# manager unpacks them (`bl-shell`).
flate2 = "1.1"
serde = { version = "1.0.228", default-features = false, features = ["std", "derive"] }
serde_json = "1"
sha2 = "0.11"
tar = { version = "0.4.46", default-features = false }
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }

[dev-dependencies]
# Reads the archives the tests build.
flate2 = "1.1"
tar = { version = "0.4.46", default-features = false }


[lints]
workspace = true
