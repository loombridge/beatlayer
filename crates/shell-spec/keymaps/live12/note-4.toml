# A part of Beatlayer's default keymap, generated by `cargo xtask keymap`; don't edit it by hand.

[[shortcut]]
id = "S-NOTE-045"
action = "Move the insert marker one grid step earlier or later"
context = "note-editor"
kind = "key"
trigger = "press"
milestone = "M2"
mac = ["Left", "Right"]
win = ["Left", "Right"]
status = "widget"
handler = "the Clip View's note editor: Left and Right move the insert marker a grid step, or the selected notes (`clip_view.set_insert_marker`, `note.move`)"

[[shortcut]]
id = "S-NOTE-046"
action = "Move the time selection's end to the next or previous note start or end"
context = "note-editor"
kind = "key"
trigger = "press"
milestone = "M2"
mac = ["Option+Shift+Left", "Option+Shift+Right"]
win = ["Alt+Shift+Left", "Alt+Shift+Right"]
status = "widget"
handler = "the Clip View's note editor: Option-Shift-Left and Option-Shift-Right move the time selection's end to the next or previous note edge (`clip_view.select_time`)"

[[shortcut]]
id = "S-NOTE-047"
action = "After a chop, while Cmd stays held, chop the same notes into one part more or fewer, or with Shift into the next or previous power of two"
context = "note-selection"
kind = "key"
trigger = "press"
milestone = "M6"
mac = ["Cmd+Up", "Cmd+Down", "Cmd+Shift+Up", "Cmd+Shift+Down"]
win = ["Ctrl+Up", "Ctrl+Down", "Ctrl+Shift+Up", "Ctrl+Shift+Down"]
status = "widget"
handler = "the Clip View's note editor: Cmd held after a chop, Up and Down chop into one part more or fewer, with Shift into the next or previous power of two (`note.chop` with `steps`)"

[[shortcut]]
id = "S-NOTE-048"
action = "Add the held notes at the insert marker and step on, or lengthen the notes just added"
context = "note-editor"
kind = "key"
trigger = "press"
milestone = "M6"
mac = ["Right"]
win = ["Right"]
status = "widget"
handler = "the Clip View's note editor: Right adds the held notes at the insert marker and steps on, or lengthens the notes just added, while step recording (`note.step_record`)"

[[shortcut]]
id = "S-NOTE-049"
action = "Shorten, then remove, the notes just added, and step back"
context = "note-editor"
kind = "key"
trigger = "press"
milestone = "M6"
mac = ["Left"]
win = ["Left"]
status = "widget"
handler = "the Clip View's note editor: Left shortens the notes just added and steps back, while step recording (`note.step_record`)"

[[shortcut]]
id = "S-NOTE-050"
action = "Change the selected notes' velocity or release velocity by 10, or by 1 with Shift"
context = "note-selection"
kind = "key"
trigger = "press"
milestone = "M6"
mac = ["Cmd+Up", "Cmd+Down", "Cmd+Shift+Up", "Cmd+Shift+Down"]
win = ["Ctrl+Up", "Ctrl+Down", "Ctrl+Shift+Up", "Ctrl+Shift+Down"]
status = "widget"
handler = "the Clip View's note editor, after a marker in the Velocity or Release Velocity lane was clicked: Cmd-Up and Cmd-Down change the selected notes' value by 10, and with Shift by 1 (`note.adjust_value`)"

[[shortcut]]
id = "S-NOTE-051"
action = "Change the selected notes' chance by 10 %, or by 1 % with Shift"
context = "note-selection"
kind = "key"
trigger = "press"
milestone = "M6"
mac = ["Up", "Down", "Shift+Up", "Shift+Down"]
win = ["Up", "Down", "Shift+Up", "Shift+Down"]
status = "widget"
handler = "the Clip View's note editor, after a marker in the Chance lane was clicked: Up and Down change the selected notes' chance by 10 %, and with Shift by 1 % (`note.adjust_value`)"

[[shortcut]]
id = "S-NOTE-052"
action = "Choose the previous or next chord in Stacks' Chord Selector Pad"
