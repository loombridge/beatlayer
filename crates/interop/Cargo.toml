[package]
autotests = false
name = "bl-interop"
description = "Standard MIDI Files, DAWproject import and export, and Ableton Live set import."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bl-core.workspace = true
bl-devices.workspace = true
bl-engine.workspace = true
bl-media.workspace = true
bl-model.workspace = true
bl-project.workspace = true
# Standard MIDI File reading and writing (architecture, "Files"): pure Rust.
# Unlicense, which `deny.toml` allows.
midly = "0.5.3"
# The DAWproject container is a ZIP file and its project is XML (WP-6.36).
# Both are already in the workspace's lock: `zip` through `bl-shell`, and
# `quick-xml` through the Linux build. `flate2` picks the backend `zip`'s
# deflate support needs, as it does in `bl-shell`: `zip`'s own feature
# brings the crate in without one.
flate2 = "1.1"
quick-xml = { version = "0.41", default-features = false }
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
midly = "0.5.3"
proptest = { version = "1.11", default-features = false, features = ["std"] }
serde_json = "1"

[[test]]
name = "interop_tests"
path = "tests/main.rs"

# Each counts heap use with a global allocator of its own, so each stays a
# binary of its own.
[[test]]
name = "dawproject_import_memory"
path = "tests/dawproject_import_memory.rs"

[[test]]
name = "dawproject_alloc"
path = "tests/dawproject_alloc.rs"

[lints]
workspace = true
