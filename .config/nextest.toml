# cargo-nextest's settings for `cargo xtask check`, which runs the tests with
# it: every test in a process of its own, as many at once as the machine has
# cores. Doctests run separately, with `cargo test --doc`.

# Keep in step with NEXTEST_VERSION in xtask/src/main.rs and the CI workflows.
nextest-version = "0.9.146"

[profile.default]
# One run reports every failure, as `cargo test --no-fail-fast` does.
fail-fast = false

# This test times how long edits take to reach the disk; beside other tests
# it would time their load instead. It takes four test slots, which is the
# whole of a CI runner (nextest caps it at the runner's count) and leaves room
# for others on a bigger machine. It starts first, so it never waits for
# running tests to finish.
[[profile.default.overrides]]
filter = "package(bl-project) & binary(crash_recovery) & test(=edits_are_journalled_within_a_second)"
threads-required = 4
priority = 100

# The slowest tests, at either BL_TEST_DEPTH, start next, so a run doesn't
# end waiting for one that started late.
[[profile.default.overrides]]
filter = """
    (package(bl-model) & binary(undo_properties))
    | (package(bl-project) & (binary(interrupted_save) | binary(crash_recovery) | binary(round_trip)))
    | (package(bl-cli) & binary(export))
    | (package(bl-engine) & binary(streaming))
    | (package(bl-ui) & binary(zoom))
    | package(beatlayer)
"""
priority = 50

# CI sets NEXTEST_PROFILE=ci: a failure's output prints as it happens and
# again at the end of the log, where it's easy to find. Overrides come from
# the default profile.
[profile.ci]
failure-output = "immediate-final"
fail-fast = false
