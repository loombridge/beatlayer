# A part of Beatlayer's default keymap, generated by `cargo xtask keymap`; don't edit it by hand.

[[shortcut]]
id = "S-NOTE-001"
action = "Select all notes"
context = "note-editor"
kind = "key"
trigger = "press"
milestone = "M2"
mac = ["Cmd+A"]
win = ["Ctrl+A"]
status = "bound"
commands = [
  { id = "clip_view.select_notes", contexts = ["note-editor"], args = { select = "all" } },
]

[[shortcut]]
id = "S-NOTE-002"
action = "Copy notes by dragging"
context = "note-editor"
kind = "mouse"
trigger = "press"
milestone = "M2"
mac = ["Option+drag"]
win = ["Ctrl+drag"]
status = "widget"
handler = "the Clip View's note editor: Option-dragging a note copies it (`note.move` with `copy`)"

[[shortcut]]
id = "S-NOTE-003"
action = "Chop the selected notes on the grid, or split them at the time selection's edges"
context = "note-editor"
kind = "key"
trigger = "press"
milestone = "M6"
mac = ["Cmd+E"]
win = ["Ctrl+E"]
status = "widget"
handler = "the Clip View's note editor: Cmd-E splits the notes the insert marker or the time selection's edges cross, or with notes selected chops them on the grid (`note.split`, `note.chop`)"

[[shortcut]]
id = "S-NOTE-004"
action = "Chop notes into a number of parts set by dragging up or down"
context = "note-editor"
kind = "mouse"
trigger = "held"
milestone = "M6"
mac = ["Cmd+E (hold) and drag", "Option+E (hold) and drag"]
win = ["Ctrl+E (hold) and drag"]
status = "widget"
handler = "the Clip View's note editor: Option-E (Ctrl-E) or Cmd-E held with a drag up or down chops the selected notes into more or fewer equal parts (`note.chop` with `parts`)"

[[shortcut]]
id = "S-NOTE-005"
action = "Chop notes in steps of two while dragging up or down"
