# Generic 8 + 8: the template Beatlayer bundles, and an example of the format.
#
# A controller template is a text file in TOML. Save your own in the User
# Library's "Controller Templates" folder (subfolders are read too) with a
# name that ends in .bltemplate.toml; a template there with this name replaces
# this one. Beatlayer reads the folder at start and whenever the Tempo & MIDI
# page of the Settings opens, and lists each template in the Control Surface
# chooser after the built-in surfaces. A file that breaks a rule isn't listed;
# the control_surface.templates command names each mistake and its line.
#
# The file starts with `format`, the version of this format. Beatlayer reads
# format 1 and refuses a file that asks for a later one.
format = 1

# [surface] describes the controller as a whole.
[surface]
# `name` is how the chooser lists the template. It is also what a row of the
# Control Surfaces table remembers, so keep it when you edit the file.
name = "Generic 8 + 8"
# `ring_width` is how many tracks wide the session ring is: the block of the
# Session View the controller's grid plays, and the tracks its faders and
# track buttons reach. Zero for a controller with no ring.
ring_width = 8
# `ring_height` is how many scenes tall the ring is; zero for a controller
# with no clip launching.
ring_height = 2
# `lock` says whether a device can be locked to the controller from its title
# bar menu, and whether arming a MIDI track locks the controller to its
# instrument.
lock = true
# `ports` is text the names of the controller's ports contain. Beatlayer then
# reads "Matches Generic 8 + 8" beside those ports in the Settings and lists
# the template first in the chooser. It never fills a row on its own.
ports = []

# Each [[control]] is one control of the controller. A control with no entry
# here is not the template's, and its messages reach manual mappings and the
# tracks as any message does.
#
# `id` is a name of your own for the control; it is only for you.
# `message` is what the control sends: "note", "cc" (a controller), "cc14" (a
# 14-bit pair: `number` and `number` + 32) or "pitch-bend".
# `channel` is the MIDI channel, 1 to 16.
# `number` is the note or controller number, 0 to 127 (0 to 31 for "cc14"); a
# pitch bend has none.
# `kind` is how its messages read:
#   "button"    sends `press` when pressed and `release` when released (a
#               note-on and a note-off for a note); they default to 127 and 0.
#   "toggle"    sends a value that says whether it is on or off.
#   "absolute"  sends its position, 0 to 127 (0 to 16,383 for "cc14" and
#               pitch bend); Takeover Mode decides what happens when it first
#               moves after a bank, device or ring change.
#   "relative"  sends steps; it needs `encoding`, one of "signed-bit",
#               "signed-bit-2", "bin-offset" or "twos-complement", and
#               `accelerated`, true if the faster it turns the bigger the
#               steps (false by default).
# `press` and `release` are a button's values, as above.
# `encoding` and `accelerated` are a relative control's, as above.
# `role` is what the control does. Numbers after a role's word count from 1.
#   slot C R            the clip slot at column C and row R of the ring
#   scene R             the launch button of the scene at row R of the ring
#   track-stop C        stops the clips of the ring's track at column C
#   track-mute C        the activator of that track
#   track-solo C        its Solo
#   track-arm C         its Arm
#   track-select C      selects it
#   stop-all-clips      Stop All Clips
#   volume C            its volume
#   pan C               its pan
#   send N C            its send to the Nth return track
#   main-volume         the Main track's volume
#   device N            the Nth parameter (1 to 8) of the device in focus's
#                       bank
#   next-bank, previous-bank
#                       the device's next or previous bank of eight
#   next-device, previous-device
#                       selects the next or previous device in the chain
#   ring-left, ring-right, ring-up, ring-down
#                       moves the ring one track or scene
#   page-left, page-right, page-up, page-down
#                       moves the ring by its width or height
#   play, stop, record, session-record, loop, metronome, tap-tempo
#                       the transport (a button flips loop, metronome and
#                       record; a toggle sets them)
#   tempo               the song's tempo, 20 to 999 BPM, from an absolute
#                       control
#   undo, redo, back-to-arrangement
#                       Undo, Redo and Back to Arrangement
# `feedback` says what the controller shows. For a button or a toggle it is
# a table of `off` and `on`, the values Beatlayer sends on the same note or
# controller, and `flash`, an optional value for a clip that is queued; a
# slot's button is `on` while its clip plays and `flash` (or `on`) while it is
# queued. For an absolute volume, pan or main-volume control it is
# `value = true`, which moves a motorised fader or a ring to the control's
# value; `value` is that key.

# Eight knobs on controllers 21 to 28, for the first eight parameters of the
# device in focus's bank.
[[control]]
id = "knob 1"
message = "cc"
channel = 1
number = 21
kind = "absolute"
role = "device 1"

[[control]]
id = "knob 2"
message = "cc"
channel = 1
number = 22
kind = "absolute"
role = "device 2"

[[control]]
id = "knob 3"
