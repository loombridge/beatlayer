# Dependency policy, checked by `cargo xtask check` through cargo-deny.
#
# Beatlayer is GPL-3.0-or-later (decision D3), so every dependency must be
# under a licence that can be combined with it. `cargo xtask deny-selftest`
# proves this file still rejects an incompatible licence.

[graph]
all-features = true

[advisories]
ignore = [
    # zvariant, zbus_names and zvariant_derive are unmaintained: they were
    # merged into zbus 6. They aren't vulnerabilities. They reach us on Linux
    # through egui-winit's accesskit (accesskit_unix needs zbus 5). Remove
    # these when accesskit moves to zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "unmaintained, merged into zbus 6; needs accesskit on zbus 6" },
    { id = "RUSTSEC-2026-0371", reason = "unmaintained, merged into zbus 6; needs accesskit on zbus 6" },
    { id = "RUSTSEC-2026-0372", reason = "unmaintained, merged into zbus 6; needs accesskit on zbus 6" },
]

[licenses]
confidence-threshold = 0.93
# The allow-list is policy, not an inventory, so licences no dependency uses yet
# are expected.
unused-allowed-license = "allow"
allow = [
    # Permissive.
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    # Weak copyleft that can be combined with GPL-3.0.
    "MPL-2.0",
    "LGPL-2.1-or-later",
    # The mp3lame crates (WP-2.26) declare the deprecated SPDX id
    # "LGPL-3.0"; cargo-deny matches GNU licences pedantically, so the
    # deprecated form needs its own entry and doesn't match the two below.
    "LGPL-3.0",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    # Strong copyleft that can be combined with GPL-3.0-or-later.
    "GPL-2.0-or-later",
    "GPL-3.0-or-later",
    # Fonts only: bundled typefaces are distributed alongside the code, which
    # OFL-1.1 permits. A code crate under OFL needs review.
    "OFL-1.1",
]
# Deliberately absent:
# - GPL-2.0-only: can't be combined with GPL-3.0.
# - GPL-3.0-only: compatible, but it would pin the whole app to GPL-3.0-only.
#   Adding it needs a decision in the architecture's decisions log.
# - AGPL, EPL, CDDL, SSPL, and proprietary licences.
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates refer to each other by path, without a version.
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The plug-in kit (MIT OR Apache-2.0), until its crates are on crates.io.
allow-git = ["https://github.com/loombridge/plugin-kit"]
