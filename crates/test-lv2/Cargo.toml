[package]
name = "bl-test-lv2"
description = "An LV2 plug-in for the plug-in host's tests (WP-5.39): a gain that echoes notes, built from source. Never shipped."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# The cdylib is the plug-in the tests load from its bundle; the rlib lets a
# test crate depend on this one, so Cargo builds the cdylib beside its tests.
crate-type = ["cdylib", "rlib"]

# The editor's view, in the host's X11 window.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb = { version = "0.13", default-features = false }

[lints]
workspace = true
