# A part of Beatlayer's default keymap, generated by `cargo xtask keymap`; don't edit it by hand.

[[shortcut]]
id = "S-ENV-001"
action = "Show or hide automation lanes (Automation Mode)"
context = "arrangement"
kind = "key"
trigger = "latch"
milestone = "M2"
mac = ["A"]
win = ["A"]
status = "bound"
commands = [
  { id = "arrangement.automation_mode", contexts = ["arrangement"] },
]

[[shortcut]]
id = "S-ENV-002"
action = "Drag breakpoints in finer steps"
context = "envelope"
kind = "modifier"
trigger = "held"
milestone = "M2"
mac = ["Shift (hold while dragging)"]
win = ["Shift (hold while dragging)"]
status = "widget"
handler = "the drag on an automation lane moves the breakpoint's value in finer steps"

[[shortcut]]
id = "S-ENV-003"
action = "Curve an automation segment"
context = "envelope"
kind = "modifier"
trigger = "held"
milestone = "M2"
mac = ["Option (hold while dragging a segment)"]
win = ["Alt (hold while dragging a segment)"]
status = "pending"

[[shortcut]]
id = "S-ENV-004"
action = "Show fade handles while held, over an automation lane"
context = "arrangement"
kind = "key"
trigger = "held"
milestone = "M1"
mac = ["F"]
win = ["F"]
status = "widget"
handler = "the Arrangement View: as S-ARR-010, F held shows every clip's fade handles, over an automation lane in Automation Mode too (audio clips R27)"

[[shortcut]]
id = "S-ENV-005"
action = "Delete the selected envelope"
context = "envelope"
kind = "key"
trigger = "press"
milestone = "M2"
mac = ["Cmd+Delete"]
win = ["Ctrl+Delete"]
status = "bound"
commands = [
  { id = "envelope.delete", contexts = ["envelope"] },
]

[[shortcut]]
id = "S-ENV-006"
action = "Ignore grid snapping while dragging breakpoints"
context = "envelope"
kind = "modifier"
trigger = "held"
milestone = "M2"
mac = ["Cmd (hold while dragging)"]
win = ["Alt (hold while dragging)"]
status = "widget"
handler = "the drag on an automation lane ignores the grid while the key is held"
