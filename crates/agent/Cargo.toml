[package]
name = "bl-agent"
description = "The agent API: Beatlayer's tools, permissions, checkpoints, and scheduled commands, served over MCP by the plug-in kit's lspk-agent."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bl-commands.workspace = true
bl-core.workspace = true
# Scheduled commands reach the engine as its own messages (WP-0.9).
bl-engine.workspace = true
bl-model.workspace = true
# Commands run through the shell, the one place every command runs (WP-1.7).
bl-shell.workspace = true
# The protocol, its transports, sessions, and permission questions: the
# plug-in kit's agent interface.
lspk-agent.workspace = true
# Pinned to bl-commands' version: the tools' input schemas come from it.
schemars = { version = "=1.2.2", default-features = false, features = ["std", "derive"] }
serde = { version = "1.0.228", default-features = false, features = ["std", "derive"] }
serde_json = "1"

[dev-dependencies]
# The perception tests' fixtures (WP-1.16): signals with known answers,
# written as WAV files the browser adds, and the previews read back.
bl-analysis.workspace = true
bl-media.workspace = true
# Seeds the query tests' set, and its own encoding is what they compare with.
bl-project.workspace = true
hound = "3.5.1"
# The kit's plug-ins through both routes: the kit's examples compiled in as native
# devices, and Example Gain hosted as a CLAP plug-in with the agent interface
# its own build exports, built into the test binary.
bl-devices = { workspace = true, features = ["kit-examples"] }
bl-plugin-host.workspace = true
# The VST3 test plug-in, built from source, which the agent's VST3 test
# loads by path.
bl-test-vst3 = { path = "../test-vst3" }
# The CLAP test plug-in, built from source, which the agent's MIDI-effect
# test loads by path (IMP-24).
bl-test-clap = { path = "../test-clap" }
lspk-example-gain.workspace = true
lspk-plugin = { workspace = true, features = ["clap"] }
lspk-plugin-agent.workspace = true

[lints]
workspace = true
