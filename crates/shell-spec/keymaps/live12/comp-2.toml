[[shortcut]]
id = "S-COMP-007"
action = "Go from a take lane to its track's main lane and fold the take lanes"
context = "take-lanes"
kind = "key"
trigger = "press"
milestone = "M6"
mac = ["Left"]
win = ["Left"]
status = "bound"
commands = [
  { id = "arrangement.show_take_lanes", contexts = ["take-lanes"], args = { on = false, title_bars = true } },
]

[[shortcut]]
id = "S-COMP-008"
action = "Move the selected take lanes up or down"
context = "take-lanes"
kind = "key"
trigger = "press"
milestone = "M6"
mac = ["Cmd+Up", "Cmd+Down"]
win = ["Ctrl+Up", "Ctrl+Down"]
status = "widget"
handler = "the Arrangement View: with take lane headers selected, Cmd-Up and Cmd-Down move the lanes up or down a place (`take_lane.move`)"
