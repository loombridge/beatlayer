# A part of Beatlayer's default keymap, generated by `cargo xtask keymap`; don't edit it by hand.

[[shortcut]]
id = "S-SAMPLE-001"
action = "Quantise the selection"
context = "sample-editor"
kind = "key"
trigger = "press"
milestone = "M4"
mac = ["Cmd+U"]
win = ["Ctrl+U"]
status = "bound"
commands = [
  { id = "clip.quantize_audio", contexts = ["sample-editor"] },
]

[[shortcut]]
id = "S-SAMPLE-002"
action = "Open the quantise settings"
context = "sample-editor"
kind = "key"
trigger = "press"
milestone = "M4"
mac = ["Cmd+Shift+U"]
win = ["Ctrl+Shift+U"]
status = "bound"
commands = [
  { id = "clip_view.quantize_settings", contexts = ["sample-editor"] },
]

[[shortcut]]
id = "S-SAMPLE-003"
action = "Move the selected warp marker"
context = "sample-editor"
kind = "key"
trigger = "press"
milestone = "M4"
mac = ["Left", "Right"]
win = ["Left", "Right"]
status = "widget"
handler = "the Clip View's Sample Editor: Left and Right move the selected warp markers by one step of the editing grid (`clip.move_warp_markers`)"

[[shortcut]]
id = "S-SAMPLE-004"
action = "Select the previous or next warp marker"
context = "sample-editor"
kind = "key"
trigger = "press"
milestone = "M4"
mac = ["Cmd+Left", "Cmd+Right"]
win = ["Ctrl+Left", "Ctrl+Right"]
status = "widget"
handler = "the Clip View's Sample Editor: Cmd-Left and Cmd-Right select the previous or next warp marker (`clip_view.select_warp_markers`)"

[[shortcut]]
id = "S-SAMPLE-005"
action = "Scroll the display to follow playback"
context = "sample-editor"
kind = "key"
trigger = "press"
milestone = "M4"
mac = ["Option+Shift+F"]
win = ["Ctrl+Shift+F"]
status = "bound"
commands = [
  { id = "arrangement.follow", contexts = ["sample-editor"] },
]

[[shortcut]]
id = "S-SAMPLE-006"
action = "Move the clip region with the start marker"
context = "loop-brace"
kind = "key"
trigger = "press"
milestone = "M2"
mac = ["Shift+Left", "Shift+Right"]
win = ["Shift+Left", "Shift+Right"]
status = "widget"
handler = "the Clip View's Sample Editor: with the Start marker selected, Shift-Left and Shift-Right move the clip's region by one step of the editing grid (`clip.set_region`)"

