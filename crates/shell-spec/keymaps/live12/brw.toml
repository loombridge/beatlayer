# A part of Beatlayer's default keymap, generated by `cargo xtask keymap`; don't edit it by hand.

[[shortcut]]
id = "S-BRW-001"
action = "Move down or up the list"
context = "browser"
kind = "key"
trigger = "press"
milestone = "M1"
mac = ["Down", "Up"]
win = ["Down", "Up"]
status = "widget"
handler = "the browser's list: Up and Down select the item above or below (`browser.select`), previewing it while Preview is on"

[[shortcut]]
id = "S-BRW-002"
action = "Show or hide the browser"
context = "global"
kind = "key"
trigger = "press"
milestone = "M1"
mac = ["Cmd+Option+B"]
win = ["Ctrl+Alt+B"]
status = "bound"
commands = [
  { id = "view.toggle_browser", contexts = ["global"] },
]

[[shortcut]]
id = "S-BRW-003"
action = "Close or open the selected folder"
context = "browser"
kind = "key"
trigger = "press"
milestone = "M1"
mac = ["Left", "Right"]
win = ["Left", "Right"]
status = "widget"
handler = "the browser's list: Right opens the selected folder and Left closes it (`browser.open_folder`); Left inside a folder selects the folder"

[[shortcut]]
id = "S-BRW-004"
action = "Load the selected item"
context = "browser"
kind = "key"
trigger = "press"
milestone = "M1"
mac = ["Enter"]
win = ["Enter"]
status = "bound"
commands = [
  { id = "browser.load_selected", contexts = ["browser"] },
]

[[shortcut]]
id = "S-BRW-005"
action = "Preview the selected file"
context = "browser"
kind = "key"
trigger = "press"
milestone = "M1"
mac = ["Shift+Enter", "Right"]
win = ["Shift+Enter", "Right"]
status = "widget"
handler = "the browser's list: Shift-Enter, and Right on a file, preview the selected file (`browser.preview`)"

