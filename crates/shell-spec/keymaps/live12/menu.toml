# A part of Beatlayer's default keymap, generated by `cargo xtask keymap`; don't edit it by hand.

[[shortcut]]
id = "S-MENU-001"
action = "Open a menu by the first letter of its title"
context = "global"
kind = "key"
trigger = "press"
milestone = "M1"
mac = []
win = ["Alt+F", "Alt+E", "Alt+C", "Alt+P", "Alt+V", "Alt+N", "Alt+O", "Alt+H"]
status = "system"
handler = "Windows' native menu bar opens a menu with Alt and its title's underlined letter"

[[shortcut]]
id = "S-MENU-002"
action = "Move up or down a menu"
context = "menu"
kind = "key"
trigger = "press"
milestone = "M1"
mac = ["Up", "Down"]
win = ["Up", "Down"]
status = "system"
handler = "the platform's menus move between items"

[[shortcut]]
id = "S-MENU-003"
action = "Open the neighbouring menu"
context = "menu"
kind = "key"
trigger = "press"
milestone = "M1"
mac = ["Left", "Right"]
win = ["Left", "Right"]
status = "system"
handler = "the platform's menus move between menus"

[[shortcut]]
id = "S-MENU-004"
action = "Choose the highlighted menu item"
context = "menu"
kind = "key"
trigger = "press"
milestone = "M1"
mac = ["Enter"]
win = ["Enter"]
status = "system"
handler = "the platform's menus choose the highlighted item"

[[shortcut]]
id = "S-MENU-005"
action = "Search the menus for a command"
context = "global"
kind = "key"
trigger = "press"
milestone = "M1"
mac = ["Cmd+Shift+Slash"]
win = []
status = "system"
handler = "macOS's Help menu searches the menus"
