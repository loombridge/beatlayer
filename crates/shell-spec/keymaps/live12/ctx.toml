# A part of Beatlayer's default keymap, generated by `cargo xtask keymap`; don't edit it by hand.

[[shortcut]]
id = "S-CTX-001"
action = "Open the context menu of the item under the pointer"
context = "global"
kind = "mouse"
trigger = "press"
milestone = "M1"
mac = ["Right-click", "Ctrl+click"]
win = ["Right-click"]
status = "widget"
handler = "every view's items open their context menu on a right-click, or a Ctrl-click on macOS (the Arrangement's, the track headers', the Session View's, the browser's and the Device View's menus)"

[[shortcut]]
id = "S-CTX-002"
action = "Open the context menu of the focused item from the keyboard"
context = "global"
kind = "key"
trigger = "press"
milestone = "M1"
mac = ["Ctrl+Option+Shift+M"]
win = ["Menu", "Shift+F10"]
status = "widget"
handler = "the focused view opens its selection's context menu: the Arrangement's clip or time-selection menu (its grid choices run `arrangement.set_grid`), or the chosen place's in the browser's sidebar (`browser.remove_folder`)"
