[package]
name = "bl-core"
description = "Time types, tempo map, IDs, units, and shared errors."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Serialise the time types with serde, for commands and project files.
serde = ["dep:serde"]

[dependencies]
serde = { version = "1.0.228", default-features = false, features = ["std", "derive"], optional = true }

[dev-dependencies]
proptest = { version = "1.11", default-features = false, features = ["std"] }
serde_json = "1"

[lints]
workspace = true
