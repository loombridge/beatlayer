[[shortcut]]
id = "S-COMP-001"
action = "Show the take lanes"
context = "arrangement"
kind = "key"
trigger = "press"
milestone = "M6"
mac = ["Cmd+Option+U"]
win = ["Ctrl+Alt+U"]
status = "bound"
commands = [
  { id = "arrangement.show_take_lanes", contexts = ["arrangement"] },
]

