# A part of Beatlayer's default keymap, generated by `cargo xtask keymap`; don't edit it by hand.

[[shortcut]]
id = "S-SWAP-001"
action = "Swap to the next similar sample"
context = "sample-swap"
kind = "key"
trigger = "press"
milestone = "M9"
mac = ["Cmd+Right"]
win = ["Ctrl+Right"]
status = "bound"
commands = [
  { id = "device.swap_similar", contexts = ["sample-swap"], args = { direction = "next" } },
]

[[shortcut]]
id = "S-SWAP-002"
action = "Swap to the previous similar sample"
context = "sample-swap"
kind = "key"
trigger = "press"
milestone = "M9"
mac = ["Cmd+Left"]
win = ["Ctrl+Left"]
status = "bound"
commands = [
  { id = "device.swap_similar", contexts = ["sample-swap"], args = { direction = "previous" } },
]

[[shortcut]]
id = "S-SWAP-003"
action = "Keep the current sample as the similarity reference"
context = "sample-swap"
kind = "key"
trigger = "press"
milestone = "M9"
mac = ["Cmd+Up"]
win = ["Ctrl+Up"]
status = "bound"
commands = [
  { id = "device.set_similarity_reference", contexts = ["sample-swap"] },
]

[[shortcut]]
id = "S-SWAP-004"
action = "Return to the reference sample"
context = "sample-swap"
kind = "key"
trigger = "press"
milestone = "M9"
mac = ["Cmd+Down"]
win = ["Ctrl+Down"]
status = "bound"
commands = [
  { id = "device.return_to_reference", contexts = ["sample-swap"] },
]

[[shortcut]]
id = "S-SWAP-005"
action = "Show the swap controls on drum pads while held"
context = "sample-swap"
kind = "modifier"
trigger = "held"
milestone = "M9"
mac = ["Option"]
win = ["Alt"]
status = "widget"
handler = "the Drum Rack's pad view: Option (Alt) held over the pads shows each swappable pad's Previous Similar and Next Similar arrows, which run `device.swap_similar` (sound similarity R26)"
