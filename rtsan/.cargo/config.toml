# Every crate in this harness's build, bl-rt included, is compiled with
# RealtimeSanitizer's entry points switched on (see crates/rt/src/sanitize.rs),
# in a target directory of its own so the main build is never invalidated.
# Cargo reads this file when it runs in `rtsan/`, which `cargo xtask rtsan`
# does. A RUSTFLAGS variable would replace these flags, so the task clears it.
[build]
rustflags = ["--cfg", "bl_rtsan"]
target-dir = "../target/rtsan"
