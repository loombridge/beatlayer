# A part of Beatlayer's default keymap, generated by `cargo xtask keymap`; don't edit it by hand.

[[shortcut]]
id = "S-EDIT-001"
action = "Cut"
context = "global"
kind = "key"
trigger = "press"
milestone = "M1"
mac = ["Cmd+X"]
win = ["Ctrl+X"]
status = "bound"
commands = [
  { id = "arrangement.cut", contexts = ["arrangement"] },
  { id = "chain.cut", contexts = ["rack-chains"] },
  { id = "clip.cut_envelope", contexts = ["envelope"], declines = true },
  { id = "device.cut", contexts = ["device-view"] },
  { id = "note.cut", contexts = ["note-editor", "note-selection"] },
  { id = "session.cut", contexts = ["session"] },
  { id = "track.cut", contexts = ["track-headers"] },
]

