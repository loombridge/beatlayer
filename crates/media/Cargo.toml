[package]
autotests = false
name = "bl-media"
description = "Decode, encode, sample-rate conversion, peak files, and disk streaming."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bl-dsp.workspace = true
# The lock-free logger, through which the disk thread reports underruns and
# read failures (WP-1.3).
bl-rt.workspace = true
blake3 = { version = "1.8.7", default-features = false, features = ["std"] }
# The background pool for peak builds: work stealing lets one long file use
# every core while many short files build side by side.
rayon = "1.12.0"
# Pinned exactly: rubato had five major releases in 2026 (architecture, "Media
# and warping"), and a resampler change alters every converted sample.
rubato = { version = "=5.0.1", default-features = false, features = ["fft_resampler"] }
symphonia = { version = "0.6.1", default-features = false, features = [
    "opt-simd",
    "wav",
    "aiff",
    "pcm",
    "adpcm",
    "flac",
    "mp3",
    "ogg",
    "vorbis",
    "isomp4",
    "aac",
    "alac",
    "id3v1",
    "id3v2",
] }
# Encoding (WP-1.12): WAV through hound, FLAC through flacenc, both pure
# Rust and the versions bl-cli already uses. No default features for the
# encoder: no logging, no threads, no serde.
hound = "3.5.1"
flacenc = { version = "0.5.1", default-features = false }
# MP3 at 320 kbps CBR (WP-2.26): safe bindings over LAME 3.100, which is
# built with the crate's own sources. LGPL-3.0, which combines with
# GPL-3.0-or-later; deny.toml allows it.
mp3lame-encoder = "0.2.5"
# Disk streaming's queues between the disk thread and the audio thread
# (WP-1.3, decision D14). The same version as the engine's.
rtrb = "0.4.0"

[dev-dependencies]
# The 64-file streaming test plays through the null device, which counts
# dropouts and heap use on its audio thread (WP-1.3).
bl-audio-io.workspace = true
# A locate through the engine's transport, played by a stand-in clip player
# (WP-1.3; the real one is WP-1.4's).
bl-core.workspace = true
bl-engine.workspace = true
bl-model.workspace = true
# Spectra for the conversion and decode measurements.
realfft = "3.5.0"
serde_json = "1"

[[test]]
name = "media_tests"
path = "tests/main.rs"

[lints]
workspace = true
