# A part of Beatlayer's default keymap, generated by `cargo xtask keymap`; don't edit it by hand.

[[shortcut]]
id = "S-VAL-001"
action = "Decrease or increase the focused value"
context = "value-field"
kind = "key"
trigger = "press"
milestone = "M1"
mac = ["Down", "Up"]
win = ["Down", "Up"]
status = "widget"
handler = "the focused value field steps its value (the Control Bar's position, loop, tempo, and time-signature fields run `transport.locate`, `transport.set_loop`, `song.set_tempo`, `song.set_time_signatures`; the mixers' and the track headers' volume and pan run `mixer.set_volume` and `mixer.set_pan`)"

[[shortcut]]
id = "S-VAL-002"
action = "Decrease or increase by octaves, or in fine steps"
context = "value-field"
kind = "key"
trigger = "press"
milestone = "M1"
mac = ["Shift+Down", "Shift+Up"]
win = ["Shift+Down", "Shift+Up"]
status = "widget"
handler = "the focused value field steps its value in fine steps"

[[shortcut]]
id = "S-VAL-003"
action = "Adjust in finer steps while dragging"
context = "value-field"
kind = "modifier"
trigger = "held"
milestone = "M1"
mac = ["Shift (hold while dragging)"]
win = ["Shift (hold while dragging)"]
status = "widget"
handler = "the value field being dragged steps in fine steps"

[[shortcut]]
id = "S-VAL-004"
action = "Return the value to its default"
context = "value-field"
kind = "key"
trigger = "press"
milestone = "M1"
mac = ["Delete"]
win = ["Delete"]
status = "widget"
handler = "the focused value field returns to its default (a mixer's volume to 0 dB, its pan to the centre)"

[[shortcut]]
id = "S-VAL-005"
action = "Type a value"
context = "value-field"
kind = "key"
trigger = "press"
milestone = "M1"
mac = ["0..9"]
win = ["0..9"]
status = "widget"
handler = "the focused value field takes a typed value"

[[shortcut]]
id = "S-VAL-006"
action = "Move to the next field of a bar-beat-sixteenth value"
context = "value-field"
kind = "key"
trigger = "press"
milestone = "M1"
mac = ["Period", "Comma"]
win = ["Period", "Comma"]
status = "widget"
handler = "the focused bar-beat-sixteenth field moves on to its next field"

[[shortcut]]
id = "S-VAL-007"
action = "Cancel value entry"
context = "value-field"
kind = "key"
trigger = "press"
milestone = "M1"
mac = ["Esc"]
win = ["Esc"]
status = "widget"
handler = "the focused value field drops a typed value"

[[shortcut]]
id = "S-VAL-008"
action = "Confirm value entry"
context = "value-field"
kind = "key"
trigger = "press"
milestone = "M1"
mac = ["Enter"]
win = ["Enter"]
status = "widget"
