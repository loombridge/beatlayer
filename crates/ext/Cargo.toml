[package]
name = "bl-ext"
description = "The extension host: WebAssembly components under wasmtime, extension packages and their validation, and the compiled-code cache."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1.0.228", default-features = false, features = ["std", "derive"] }
# Hashes name a component's compiled code (R5).
sha2 = "0.11"
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
# The versions the project and the shell already build.
flate2 = "1.1"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }
# The features the spike measured (WP-9.28): the pooling allocator and epoch
# interruption, a compiler for installing, and no async, GC, profiling,
# debug support or on-disk cache (its `zstd` fails the advisory check).
wasmtime = { version = "=50.0.1", default-features = false, features = [
    "component-model",
    "cranelift",
    "pooling-allocator",
    "runtime",
    "std",
] }

[dev-dependencies]
# The test components are written as WebAssembly text.
wat = "1"
# The WIT worlds under `wit/` are parsed to hold them to the host's kinds and version.
wit-parser = { version = "0.261", default-features = false, features = ["decoding"] }

[lints]
workspace = true
