# A part of Beatlayer's default keymap, generated by `cargo xtask keymap`; don't edit it by hand.

[[shortcut]]
id = "S-NOTE-038"
action = "Fold the editor to the key tracks that hold notes"
context = "note-editor"
kind = "key"
trigger = "press"
milestone = "M2"
mac = ["F"]
win = ["F"]
status = "bound"
commands = [
  { id = "view.fold_notes", contexts = ["note-editor"] },
]

[[shortcut]]
id = "S-NOTE-039"
action = "Fold the editor to the clip's scale"
context = "note-editor"
kind = "key"
trigger = "press"
milestone = "M6"
mac = ["G"]
win = ["G"]
status = "pending"

[[shortcut]]
id = "S-NOTE-040"
action = "Toggle Focus Mode for multi-clip editing (momentary while held)"
context = "note-editor"
kind = "key"
trigger = "latch"
milestone = "M6"
mac = ["N"]
win = ["N"]
status = "bound"
commands = [
  { id = "clip_view.focus_mode", contexts = ["note-editor"] },
]

[[shortcut]]
id = "S-NOTE-041"
action = "Deactivate the selected notes"
context = "note-selection"
kind = "key"
trigger = "press"
milestone = "M6"
mac = ["0"]
win = ["0"]
status = "bound"
commands = [
  { id = "note.deactivate", contexts = ["note-selection"] },
]

[[shortcut]]
id = "S-NOTE-042"
action = "Deselect the notes"
context = "note-selection"
kind = "key"
trigger = "press"
milestone = "M2"
mac = ["Esc"]
win = ["Esc"]
status = "widget"
handler = "the Clip View's note editor: Esc deselects the notes and clears the time selection (`clip_view.select_notes`, `clip_view.select_time`)"

[[shortcut]]
id = "S-NOTE-043"
action = "Add the previous or next note to the selection"
context = "note-selection"
kind = "key"
trigger = "press"
milestone = "M2"
mac = ["Option+Shift+Down", "Option+Shift+Up"]
win = ["Ctrl+Shift+Down", "Ctrl+Shift+Up"]
status = "widget"
handler = "the Clip View's note editor: Option-Shift-Down and Option-Shift-Up add the previous or next note to the selection (`clip_view.select_notes`)"
