# A part of Beatlayer's default keymap, generated by `cargo xtask keymap`; don't edit it by hand.

[[shortcut]]
id = "S-DEV-012"
action = "Show the selected rack's chain list"
context = "device-view"
kind = "key"
trigger = "press"
milestone = "M5"
mac = ["Plus"]
win = ["Plus"]
status = "bound"
commands = [
  { id = "rack.set_view", contexts = ["device-view"], args = { shown = true, view = "chain_list" } },
]

[[shortcut]]
id = "S-DEV-013"
action = "Hide the selected rack's chain list"
context = "device-view"
kind = "key"
trigger = "press"
milestone = "M5"
mac = ["Minus"]
win = ["Minus"]
status = "bound"
commands = [
  { id = "rack.set_view", contexts = ["device-view"], args = { shown = false, view = "chain_list" } },
]

[[shortcut]]
id = "S-DEV-014"
action = "Fold or unfold the selected device"
context = "device-view"
kind = "key"
trigger = "press"
milestone = "M2"
mac = ["Minus"]
win = ["Minus"]
status = "bound"
commands = [
  { id = "device.fold", contexts = ["device-view"] },
]

[[shortcut]]
id = "S-DEV-015"
action = "Float the selected device in its own window, or dock it"
context = "device-view"
kind = "key"
trigger = "press"
milestone = "M2"
mac = ["Option+F"]
win = ["Ctrl+Alt+F"]
status = "bound"
commands = [
  { id = "device.set_floating", contexts = ["device-view"] },
]

[[shortcut]]
id = "S-DEV-016"
action = "Step Roar's Feedback Note by a semitone"
context = "device-view"
kind = "key"
trigger = "press"
milestone = "M5"
mac = ["Down", "Up"]
win = ["Down", "Up"]
status = "widget"
handler = "Roar's Feedback Note control steps its key by a semitone, as a device control's own keys do (the roar spec R26)"

[[shortcut]]
id = "S-DEV-017"
action = "Step Roar's Feedback Note by an octave"
context = "device-view"
kind = "key"
trigger = "press"
milestone = "M5"
mac = ["Shift+Down", "Shift+Up"]
win = ["Shift+Down", "Shift+Up"]
status = "widget"
handler = "Roar's Feedback Note control steps its key by an octave, its coarse step (the roar spec R26)"
