# A part of Beatlayer's default keymap, generated by `cargo xtask keymap`; don't edit it by hand.

[[shortcut]]
id = "S-TRACK-001"
action = "Insert an audio track"
context = "global"
kind = "key"
trigger = "press"
milestone = "M1"
mac = ["Cmd+T"]
win = ["Ctrl+T"]
status = "bound"
commands = [
  { id = "track.create", contexts = ["global"], args = { kind = "audio" } },
]

