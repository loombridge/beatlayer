# Live 12 keyboard shortcuts: the source of truth for Beatlayer's default keymap (D16).
#
# docs/ui-parity/shortcuts.md is generated from this file by `cargo xtask ui-parity`,
# and `cargo xtask check` fails if the two differ, if an ID repeats, or if two entries
# bind the same keys in the same context without saying why. The fields are described
# in docs/ui-parity/README.md. Actions are written in our own words; the manual's
# wording is never copied.

schema = 1
live_version = "12.4.3"
manual = "Ableton Live 12 reference manual, chapters 41 and 42, read 10 October 2026"

[[context]]
id = "global"
description = "Anywhere in a main window, unless a narrower context binds the same keys."

[[context]]
id = "dialog"
description = "A secondary window or dialog has focus."

[[context]]
id = "tab-focus"
description = "Use Tab Key to Move Focus is on (Navigate menu or Display & Input settings)."

[[context]]
id = "text-field"
description = "A name or text is being edited."

[[context]]
id = "value-field"
description = "A value control (knob, slider, number box) has focus."

[[context]]
id = "menu"
description = "A menu is open."

[[context]]
id = "session"
description = "The Session View has focus."

[[context]]
id = "arrangement"
description = "The Arrangement View has focus."

[[context]]
id = "track-headers"
description = "A track title bar is selected, in either view."

[[context]]
id = "take-lanes"
description = "A take lane is selected in the Arrangement."

[[context]]
id = "loop-brace"
description = "A loop brace or a clip start or end marker is selected, or a multi-clip loop bar."

[[context]]
id = "envelope"
description = "An automation lane or the Clip View's Envelope Editor has focus."

[[context]]
id = "clip-view"
description = "The Clip View has focus, whichever editor it shows."

[[context]]
id = "sample-editor"
description = "The Clip View shows an audio clip's Sample Editor."

[[context]]
id = "note-editor"
description = "The Clip View shows a MIDI clip's MIDI Note Editor."

[[context]]
id = "note-selection"
description = "Notes are selected in the MIDI Note Editor."

[[context]]
id = "device-view"
description = "The Device View has focus."

[[context]]
id = "rack-chains"
description = "A rack's chain list has focus."

[[context]]
id = "sample-swap"
description = "A Drum Rack, a pad, Simpler or Drum Sampler is selected."

[[context]]
id = "browser"
description = "The browser's content pane has focus."

[[context]]
id = "browser-sidebar"
description = "The browser's sidebar has focus."

[[context]]
id = "browser-search"
description = "The browser's search field has focus."

[[context]]
id = "computer-midi-keyboard"
description = "The computer MIDI keyboard is on."

[[context]]
id = "settings"
description = "The Settings window has focus."

