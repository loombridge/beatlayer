[package]
name = "beatlayer-fuzz"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
description = "Fuzz targets for Beatlayer's file readers, run with cargo-fuzz on a nightly toolchain"

[package.metadata]
cargo-fuzz = true

# A standalone workspace, like spikes/: cargo-fuzz needs a nightly toolchain
# and libFuzzer, while the product builds on the pinned stable one. It keeps
# its own Cargo.lock, so its dependencies never touch the product's.
[workspace]

[dependencies]
bl-core = { path = "../crates/core" }
bl-interop = { path = "../crates/interop" }
bl-media = { path = "../crates/media" }
bl-project = { path = "../crates/project" }
bl-video = { path = "../crates/video" }
libfuzzer-sys = "=0.4.13"

[[bin]]
name = "audio_header"
path = "fuzz_targets/audio_header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dawproject"
path = "fuzz_targets/dawproject.rs"
test = false
doc = false
bench = false

[[bin]]
name = "groove_file"
path = "fuzz_targets/groove_file.rs"
test = false
doc = false
bench = false

[[bin]]
name = "movie"
path = "fuzz_targets/movie.rs"
test = false
doc = false
bench = false

[[bin]]
name = "midi_file"
path = "fuzz_targets/midi_file.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pack"
path = "fuzz_targets/pack.rs"
test = false
doc = false
bench = false

[[bin]]
name = "peak_file"
path = "fuzz_targets/peak_file.rs"
test = false
doc = false
bench = false

[[bin]]
name = "clip_file"
path = "fuzz_targets/clip_file.rs"
test = false
doc = false
bench = false

[[bin]]
name = "preset"
path = "fuzz_targets/preset.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sfz"
path = "fuzz_targets/sfz.rs"
test = false
doc = false
bench = false

[[bin]]
name = "set_file"
path = "fuzz_targets/set_file.rs"
test = false
doc = false
bench = false

[[bin]]
name = "set_json"
path = "fuzz_targets/set_json.rs"
test = false
doc = false
bench = false

[profile.release]
# Keep overflow checks and debug assertions on, so the fuzzer finds what a
# debug build would panic on.
debug-assertions = true
overflow-checks = true
